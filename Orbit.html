<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit AI</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{
  --bg:#0f172a;--panel:#111827;--panel2:#1f2937;
  --accent:#2563eb;--border:#2d3748;--text:#e5e7eb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);display:flex;height:100vh;font-family:Inter,sans-serif;overflow:hidden}
.typing{display:flex;gap:5px;align-items:center}
.typing span{width:8px;height:8px;background:white;border-radius:50%;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:0.3}50%{opacity:1}}
.recording{background:#ef4444!important;animation:pulse 1s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}
.sidebar{width:260px;min-width:260px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
@media(max-width:768px){.sidebar{width:70px;min-width:70px}.thread-title{display:none}textarea{height:45px}}
#newChatBtn{margin:10px;padding:10px;background:var(--accent);border:none;color:white;border-radius:8px;cursor:pointer;font-size:14px}
#chatSearch{margin:0 10px 8px;padding:7px 10px;border-radius:6px;border:none;background:var(--panel2);color:white;font-size:13px;outline:none;width:calc(100% - 20px)}
#threads,#archivedThreads{overflow-y:auto}
.thread{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.thread:hover{background:rgba(255,255,255,.04)}
.thread.active{background:var(--panel2)}
#archivedSection{padding:8px 12px;font-size:11px;opacity:.5;text-transform:uppercase}
#profileBtn{margin-top:auto;padding:12px;border-top:1px solid var(--border);cursor:pointer;font-size:13px;opacity:.8;display:flex;align-items:center;gap:8px;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.message{max-width:75%;padding:12px 14px;border-radius:12px;word-wrap:break-word;line-height:1.5;font-size:14px}
.message.user{align-self:flex-end;background:var(--accent)}
.message.assistant{align-self:flex-start;background:var(--panel2)}
.message p{margin:0 0 8px}.message p:last-child{margin:0}
.message pre{background:#0f172a;padding:10px;border-radius:6px;overflow-x:auto;font-size:12px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.gallery img{width:100%;border-radius:8px;cursor:pointer}
.input-area{display:flex;border-top:1px solid var(--border);padding:10px;gap:8px;align-items:flex-end;position:relative;flex-shrink:0}
.input-area textarea{flex:1;background:var(--panel2);border:1px solid var(--border);color:white;padding:10px;border-radius:8px;height:60px;resize:none;font-size:14px;font-family:inherit;outline:none}
.input-area textarea:focus{border-color:var(--accent)}
.input-area button{background:var(--accent);border:none;padding:10px 14px;color:white;border-radius:8px;cursor:pointer;font-size:16px;flex-shrink:0;transition:opacity .15s}
.input-area button:hover{opacity:.85}
.input-area button:disabled{opacity:.4;cursor:not-allowed}
#imagePreviewContainer{display:none;position:absolute;bottom:80px;left:200px;background:#1f2937;padding:8px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.4);z-index:2000}
#imagePreview{max-width:200px;border-radius:8px;display:block}
#clearPreviewBtn{margin-top:6px;width:100%;background:#ef4444;border:none;color:white;padding:5px;border-radius:6px;cursor:pointer;font-size:12px}
.input-area.dragover{outline:2px dashed var(--accent);border-radius:8px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:3000}
.modal-overlay.open{display:flex}
.modal-box{background:#1f2937;padding:24px;border-radius:14px;width:340px;max-height:90vh;overflow-y:auto}
.modal-box h3{margin:0 0 16px;font-size:16px}
.modal-box input,.modal-box select{width:100%;margin-bottom:10px;padding:9px 10px;border-radius:6px;border:1px solid var(--border);background:#111827;color:white;font-size:13px;outline:none}
.modal-box input:focus{border-color:var(--accent)}
.modal-box .save-btn{margin-top:6px;width:100%;padding:10px;background:var(--accent);border:none;color:white;border-radius:8px;cursor:pointer;font-size:14px}
#chatMenu{position:fixed;display:none;background:#1f2937;border:1px solid var(--border);border-radius:8px;overflow:hidden;z-index:4000;min-width:140px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.menuItem{padding:10px 14px;cursor:pointer;font-size:13px}
.menuItem:hover{background:var(--panel2)}
.menuItem.danger{color:#ef4444}
#statusBar{font-size:11px;opacity:.5;padding:4px 20px;flex-shrink:0;text-align:right}
</style>
</head>
<body>

<div class="sidebar">
  <button id="newChatBtn" onclick="createThread()">+ New Chat</button>
  <input id="chatSearch" placeholder="Search chats…" oninput="renderThreads()">
  <div id="threads"></div>
  <div id="archivedSection" style="display:none">Archived</div>
  <div id="archivedThreads"></div>
  <div id="profileBtn">👤 <span id="profileName">User</span></div>
</div>

<div class="main">
  <div class="chat" id="chat"></div>
  <div id="statusBar"></div>
  <div class="input-area" id="dropzone">
    <button id="micBtn" title="Voice">🎤</button>
    <button onclick="triggerFile()" title="Attach">📎</button>
    <textarea id="input" placeholder="Ask Orbit anything…"></textarea>
    <div id="imagePreviewContainer">
      <img id="imagePreview" alt="preview">
      <button id="clearPreviewBtn" onclick="clearImagePreview()">✕ Remove</button>
    </div>
    <button id="sendBtn" onclick="send()">➤</button>
    <input type="file" id="fileInput" style="display:none" accept="image/*,application/pdf,.xlsx,.xls,.docx,.doc,.pptx">
  </div>
</div>

<div id="profileModal" class="modal-overlay">
  <div class="modal-box">
    <h3 id="profileModalTitle">Your Profile</h3>
    <input id="p_name"       placeholder="Name (required)">
    <input id="p_email"      placeholder="Email (required)" type="email">
    <input id="p_age"        placeholder="Age">
    <input id="p_dob"        type="date">
    <input id="p_profession" placeholder="Profession">
    <input id="p_hobby"      placeholder="Hobby">
    <input id="p_country"    placeholder="Country">
    <input id="p_skills"     placeholder="Skills (e.g. Python-Advanced)">
    <select id="p_style">
      <option>Professional</option><option>Friendly</option>
      <option>Technical</option><option>Witty</option>
    </select>
    <button class="save-btn" onclick="saveProfile()">Save Profile</button>
  </div>
</div>

<div id="chatMenu">
  <div class="menuItem"        onclick="handleChatAction('rename')">✏️ Rename</div>
  <div class="menuItem"        onclick="handleChatAction('archive')">📁 Archive</div>
  <div class="menuItem danger" onclick="handleChatAction('delete')">🗑 Delete</div>
</div>

<script>
// ════════════════════════════════════════════
// FIX 1: All API calls use absolute backend URL
// ════════════════════════════════════════════
const BACKEND = "https://orbit-38iw.onrender.com";
const WS_URL  = "wss://orbit-38iw.onrender.com/ws";

let userProfile    = JSON.parse(localStorage.getItem("orbit_user_profile") || "null");
let threads        = JSON.parse(localStorage.getItem("orbit_threads")       || "[]");
let activeThreadId = null;
let ws;
let uploadedFileId  = null;
let uploadedPreview = null;
let recorder        = null;
let audioChunks     = [];
let isProcessing    = false;

// ── INIT ──────────────────────────────────────
window.addEventListener("load", () => {
  if (threads.length === 0) createThread();
  else openThread(threads[0].id);

  if (!userProfile || !userProfile.name || !userProfile.email)
    openProfileModal(true);

  updateProfileUI();
  checkBirthday();
  initWS();
});

// ── WEBSOCKET ─────────────────────────────────
function initWS() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  ws = new WebSocket(WS_URL);
  ws.onopen    = ()  => setStatus("Connected");
  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === "token") appendAssistantToken(data.content);
      if (data.type === "done")  finalizeAssistant(data.remaining);
      if (data.error) { showError(data.error); finalizeAssistant(); }
    } catch(err) { console.error("WS parse error:", err); }
  };
  ws.onclose = () => { setStatus("Reconnecting…"); finalizeAssistant(); setTimeout(initWS, 2500); };
  ws.onerror = () => ws.close();
}

function setStatus(msg) { document.getElementById("statusBar").textContent = msg; }

// ── THREADS ───────────────────────────────────
function createThread() {
  const id = crypto.randomUUID();
  threads.unshift({ id, title: "New Chat", messages: [], archived: false });
  saveThreads(); renderThreads(); openThread(id);
}
function openThread(id) { activeThreadId = id; renderThreads(); renderChat(); }

function renderThreads() {
  const active   = document.getElementById("threads");
  const archived = document.getElementById("archivedThreads");
  const arcSec   = document.getElementById("archivedSection");
  const filter   = (document.getElementById("chatSearch")?.value || "").toLowerCase();
  active.innerHTML = archived.innerHTML = "";
  let hasArchived = false;
  threads.filter(t => t.title.toLowerCase().includes(filter)).forEach(t => {
    const div = document.createElement("div");
    div.className = "thread" + (t.id === activeThreadId ? " active" : "");
    div.innerHTML = `<span class="thread-title">${escHtml(t.title)}</span>`;
    div.onclick = () => openThread(t.id);
    div.oncontextmenu = (e) => { e.preventDefault(); openThreadMenu(t.id, e); };
    if (t.archived) { archived.appendChild(div); hasArchived = true; }
    else active.appendChild(div);
  });
  arcSec.style.display = hasArchived ? "block" : "none";
}

function saveThreads() {
  const trimmed = threads.map(t => ({ ...t, messages: t.messages.slice(-200) }));
  try { localStorage.setItem("orbit_threads", JSON.stringify(trimmed)); }
  catch(e) { threads = threads.slice(0, 20); localStorage.setItem("orbit_threads", JSON.stringify(threads)); }
}
function getActiveThread() { return threads.find(t => t.id === activeThreadId); }

// ── CHAT RENDER ───────────────────────────────
function renderChat() {
  const chat = document.getElementById("chat");
  chat.innerHTML = "";
  const thread = getActiveThread();
  if (!thread) return;
  thread.messages.forEach(m => chat.appendChild(buildMessageEl(m)));
  chat.scrollTop = chat.scrollHeight;
}

function buildMessageEl(msg) {
  const div = document.createElement("div");
  div.className = "message " + msg.role;
  if (msg.text === "__TYPING__")
    div.innerHTML = "<div class='typing'><span></span><span></span><span></span></div>";
  else if (msg.text)
    div.innerHTML = marked.parse(msg.text);
  if (msg.images?.length) {
    const gallery = document.createElement("div");
    gallery.className = "gallery";
    msg.images.forEach(src => {
      const img = document.createElement("img");
      img.src = src;
      img.onclick = () => window.open(src, "_blank");
      gallery.appendChild(img);
    });
    div.appendChild(gallery);
  }
  return div;
}

// ── SEND ──────────────────────────────────────
function send() {
  if (isProcessing) return;
  const inputEl = document.getElementById("input");
  const text    = inputEl.value.trim();
  if (!text && !uploadedFileId) return;

  // FIX 2: guard against sending when WS not ready
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    showError("Not connected. Reconnecting…"); initWS(); return;
  }

  const thread = getActiveThread();
  if (!thread) return;

  thread.messages.push({ role: "user", text: text || "(file)", images: uploadedPreview ? [uploadedPreview] : null });
  inputEl.value   = "";
  uploadedPreview = null;
  document.getElementById("imagePreviewContainer").style.display = "none";
  thread.messages.push({ role: "assistant", text: "__TYPING__" });
  saveThreads(); renderChat();

  isProcessing = true;
  setInputLock(true);
  ws.send(JSON.stringify({ question: text || "User sent a file.", image_file_id: uploadedFileId || null }));
  uploadedFileId = null;
}

document.getElementById("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

// ── STREAM HANDLERS ───────────────────────────
function appendAssistantToken(token) {
  const thread = getActiveThread();
  if (!thread) return;
  const last = thread.messages[thread.messages.length - 1];
  if (!last || last.role !== "assistant") return;
  if (last.text === "__TYPING__") last.text = "";
  last.text += token;
  const chat  = document.getElementById("chat");
  const nodes = chat.querySelectorAll(".message.assistant");
  const lastNode = nodes[nodes.length - 1];
  if (lastNode) lastNode.innerHTML = marked.parse(last.text);
  chat.scrollTop = chat.scrollHeight;
}

function finalizeAssistant(remaining) {
  autoTitle(); saveThreads();
  isProcessing = false;
  setInputLock(false);
  if (remaining !== undefined) setStatus(`${remaining} messages left today`);
}

function setInputLock(lock) {
  document.getElementById("input").disabled   = lock;
  document.getElementById("micBtn").disabled  = lock;
  document.getElementById("sendBtn").disabled = lock;
}

function showError(msg) {
  const thread = getActiveThread();
  if (!thread) return;
  const last = thread.messages[thread.messages.length - 1];
  if (last?.text === "__TYPING__") last.text = `⚠️ ${msg}`;
  else thread.messages.push({ role: "assistant", text: `⚠️ ${msg}` });
  saveThreads(); renderChat();
}

// ── AUTO TITLE ────────────────────────────────
function autoTitle() {
  const thread = getActiveThread();
  if (!thread) return;
  if (thread.title === "New Chat" && thread.messages.length > 0) {
    const first = thread.messages.find(m => m.role === "user");
    if (first) thread.title = (first.text || "Chat").slice(0, 35);
  }
  renderThreads();
}

// ── PROFILE ───────────────────────────────────
// FIX 3: setCookie helper — backend reads orbit_name / orbit_email from cookies
function setCookie(name, value, days = 365) {
  const exp = new Date(Date.now() + days * 864e5).toUTCString();
  document.cookie = `${name}=${encodeURIComponent(value)};expires=${exp};path=/;SameSite=Lax`;
}

function updateProfileUI() {
  document.getElementById("profileBtn").onclick = () => openProfileModal(false);
  const el = document.getElementById("profileName");
  if (el && userProfile) el.textContent = userProfile.name || "User";
}

function openProfileModal(force) {
  document.getElementById("profileModal").classList.add("open");
  if (userProfile) {
    document.getElementById("p_name").value       = userProfile.name       || "";
    document.getElementById("p_email").value      = userProfile.email      || "";
    document.getElementById("p_age").value        = userProfile.age        || "";
    document.getElementById("p_dob").value        = userProfile.dob        || "";
    document.getElementById("p_profession").value = userProfile.profession || "";
    document.getElementById("p_hobby").value      = userProfile.hobby      || "";
    document.getElementById("p_country").value    = userProfile.country    || "";
    document.getElementById("p_skills").value     = userProfile.skills     || "";
    document.getElementById("p_style").value      = userProfile.style      || "Professional";
  }
  document.getElementById("profileModalTitle").textContent = force ? "Complete Your Profile" : "Edit Profile";
}

function saveProfile() {
  const name  = document.getElementById("p_name").value.trim();
  const email = document.getElementById("p_email").value.trim();
  if (!name || !email) { alert("Name and Email are required."); return; }
  const dob = document.getElementById("p_dob").value;
  if (dob && new Date(dob) >= new Date()) { alert("DOB must be in the past."); return; }

  userProfile = {
    name, email,
    age:        document.getElementById("p_age").value.trim(),
    dob,
    profession: document.getElementById("p_profession").value.trim(),
    hobby:      document.getElementById("p_hobby").value.trim(),
    country:    document.getElementById("p_country").value.trim(),
    skills:     document.getElementById("p_skills").value.trim(),
    style:      document.getElementById("p_style").value,
  };
  localStorage.setItem("orbit_user_profile", JSON.stringify(userProfile));

  // FIX 3: set cookies so FastAPI backend can read them
  setCookie("orbit_name",  userProfile.name);
  setCookie("orbit_email", userProfile.email);

  updateProfileUI();
  document.getElementById("profileModal").classList.remove("open");
}

// Close profile modal on backdrop click (only if profile complete)
document.getElementById("profileModal").addEventListener("click", (e) => {
  if (e.target === document.getElementById("profileModal"))
    if (userProfile?.name && userProfile?.email)
      document.getElementById("profileModal").classList.remove("open");
});

// ── BIRTHDAY ──────────────────────────────────
function checkBirthday() {
  if (!userProfile?.dob) return;
  const todayStr = new Date().toISOString().slice(0,10);
  if (userProfile.dob.slice(5,10) !== todayStr.slice(5,10)) return;
  if (localStorage.getItem("orbit_last_birthday_wish") === todayStr) return;
  const thread = getActiveThread();
  if (thread) {
    thread.messages.push({ role: "assistant", text: `🎉 Happy Birthday, ${userProfile.name}!` });
    saveThreads(); renderChat();
  }
  localStorage.setItem("orbit_last_birthday_wish", todayStr);
}

// ── CONTEXT MENU ──────────────────────────────
let selectedThreadId = null;
function openThreadMenu(id, event) {
  selectedThreadId = id;
  const menu = document.getElementById("chatMenu");
  menu.style.left = event.pageX + "px";
  menu.style.top  = event.pageY + "px";
  menu.style.display = "block";
}
function handleChatAction(action) {
  const t = threads.find(x => x.id === selectedThreadId);
  if (!t) return;
  if (action === "rename") { const n = prompt("New name:", t.title); if (n) t.title = n; }
  if (action === "archive") t.archived = !t.archived;
  if (action === "delete") {
    if (!confirm("Delete this chat permanently?")) return;
    threads = threads.filter(x => x.id !== selectedThreadId);
    if (activeThreadId === selectedThreadId) {
      if (threads.length) openThread(threads[0].id); else createThread();
    }
  }
  saveThreads(); renderThreads();
  document.getElementById("chatMenu").style.display = "none";
}
// FIX 4: close context menu on any outside click
document.addEventListener("click", (e) => {
  if (!document.getElementById("chatMenu").contains(e.target))
    document.getElementById("chatMenu").style.display = "none";
});

// ── FILE UPLOAD ───────────────────────────────
function triggerFile() { document.getElementById("fileInput").click(); }
function clearImagePreview() {
  uploadedPreview = uploadedFileId = null;
  document.getElementById("fileInput").value = "";
  document.getElementById("imagePreviewContainer").style.display = "none";
}

document.getElementById("fileInput").onchange = async () => {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return;
  const form = new FormData();
  form.append("file", file);
  try {
    // FIX 1: absolute backend URL
    const res  = await fetch(`${BACKEND}/upload`, { method: "POST", body: form });
    const data = await res.json();
    if (!data.file_id) { showError("Upload failed."); return; }
    uploadedFileId = data.file_id;
  } catch(err) { showError("Upload error: " + err.message); return; }

  if (file.type.startsWith("image/")) {
    const reader = new FileReader();
    reader.onload = (e) => {
      uploadedPreview = e.target.result;
      document.getElementById("imagePreview").src = uploadedPreview;
      document.getElementById("imagePreviewContainer").style.display = "block";
    };
    reader.readAsDataURL(file);
  } else {
    document.getElementById("imagePreview").alt = file.name;
    document.getElementById("imagePreview").src = "";
    document.getElementById("imagePreviewContainer").style.display = "block";
  }
};

const dropzone = document.getElementById("dropzone");
dropzone.addEventListener("dragover",  (e) => { e.preventDefault(); dropzone.classList.add("dragover"); });
dropzone.addEventListener("dragleave", ()  => dropzone.classList.remove("dragover"));
dropzone.addEventListener("drop", (e) => {
  e.preventDefault(); dropzone.classList.remove("dragover");
  if (e.dataTransfer.files.length) {
    document.getElementById("fileInput").files = e.dataTransfer.files;
    document.getElementById("fileInput").onchange();
  }
});

// ── VOICE RECORDING ───────────────────────────
// FIX 5: onstop is attached immediately after recorder creation (not in else branch)
//         so it's always wired up before stop() is ever called.
// FIX 1: voice-to-text uses absolute backend URL.
document.getElementById("micBtn").addEventListener("click", toggleRecording);

async function toggleRecording() {
  const btn = document.getElementById("micBtn");

  // STOP
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }

  // START
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e) { alert("Microphone permission denied."); return; }

  audioChunks = [];
  recorder    = new MediaRecorder(stream);

  // FIX 5: attach BEFORE start() so it's always registered
  recorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
  recorder.onstop = async () => {
    btn.classList.remove("recording");
    btn.textContent = "🎤";
    document.getElementById("input").placeholder = "";
    document.getElementById("input").disabled    = false;
    stream.getTracks().forEach(t => t.stop());

    const blob = new Blob(audioChunks, { type: "audio/webm" });
    if (blob.size < 100) { recorder = null; return; }

    const form = new FormData();
    form.append("file", blob, "audio.webm");
    try {
      // FIX 1: absolute backend URL
      const res  = await fetch(`${BACKEND}/voice-to-text`, { method: "POST", body: form });
      const data = await res.json();
      if (data.text) { document.getElementById("input").value = data.text; send(); }
    } catch(err) { showError("Voice transcription failed."); }
    finally { recorder = null; audioChunks = []; }
  };

  recorder.start();
  btn.classList.add("recording");
  btn.textContent = "⏹";
  document.getElementById("input").placeholder = "Listening…";
  document.getElementById("input").disabled    = true;
  setTimeout(() => { if (recorder?.state === "recording") recorder.stop(); }, 60000);
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
</body>
</html>
