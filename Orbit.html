/* ════════════════════════════════════════════
   SEND
════════════════════════════════════════════ */
function send() {
  if (busy) return;
  const ta   = document.getElementById("inputTextarea");
  const text = ta.value;
  if (!text.trim() && !fileId) return;

  if (!ws || ws.readyState !== WebSocket.OPEN) {
    toast("Not connected — reconnecting…"); connectWS(); return;
  }

  const t = activeThread();
  if (!t) return;

  t.messages.push({
    role: "user",
    text: text || "(file sent)",
    images: (filePreview && fileIsImage) ? [filePreview] : null,
  });

  ta.value = "";
  ta.style.height = "auto";
  const prevFileId      = fileId;
  const prevFileIsImage = fileIsImage;
  filePreview = null; fileId = null; fileIsImage = false;
  hidePreview();

  t.messages.push({ role: "assistant", text: "__TYPING__" });
  saveThreads(); renderChat();

  busy = true;
  lockInput(true);

  // Stop speaking when a new message is sent
  stopSpeaking();

  ws.send(JSON.stringify({
    question:      text || "User sent a file.",
    image_file_id: (prevFileId && prevFileIsImage)  ? prevFileId : null,
    file_id:       (prevFileId && !prevFileIsImage) ? prevFileId : null,
    profile:       profilePayload(),
  }));

  closeSidebar();
}

document.getElementById("inputTextarea").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && window.innerWidth >= 640) {
    e.preventDefault();
    send();
  }
});

/* ════════════════════════════════════════════
   STREAMING
════════════════════════════════════════════ */
function applyDownloadLinks(node) {
  node.querySelectorAll("a").forEach(a => {
    const href = a.getAttribute("href") || "";
    if (!href.includes("/download/")) return;
    const fullUrl = href.startsWith("http") ? href : `${BACKEND}${href}`;
    a.href = fullUrl; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.setAttribute("download", "");
    const label = a.textContent.trim() || "Download file";
    a.innerHTML = `⬇️ ${label}`;
    a.style.cssText = [
      "display:inline-block;padding:9px 18px;margin:8px 2px 4px;",
      "background:#2563eb;color:white;border-radius:10px;",
      "text-decoration:none;font-weight:600;font-size:14px;",
      "box-shadow:0 2px 8px rgba(37,99,235,.35);",
    ].join("");
  });
}

function streamToken(tok) {
  const t = activeThread();
  if (!t) return;
  const last = t.messages[t.messages.length - 1];
  if (!last || last.role !== "assistant") return;
  if (last.text === "__TYPING__") last.text = "";
  last.text += tok;

  const chat  = document.getElementById("chat");
  const wraps = chat.querySelectorAll(".message-wrap.assistant");
  const wrap  = wraps[wraps.length - 1];
  if (!wrap) return;
  const node  = wrap.querySelector(".message.assistant");
  if (node) {
    node.innerHTML = marked.parse(last.text);
    applyDownloadLinks(node);
    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([node]).catch(() => {});
  }
  ensureActionsBar(wrap, last);
  chat.scrollTop = chat.scrollHeight;
}

function ensureActionsBar(wrap, msg) {
  if (!wrap) return;
  if (wrap.querySelector(".message-actions")) return;
  if (msg.text === "__TYPING__") return;
  wrap.appendChild(buildActionsBar(msg));
}

function finalize(remaining) {
  const t = activeThread();
  if (t && t.messages.length >= 2) {
    const lastUser = t.messages[t.messages.length - 2];
    const lastAI   = t.messages[t.messages.length - 1];
    if (lastUser?.role === "user" && lastAI?.role === "assistant") {
      updateUserMemory(lastUser.text, lastAI.text);

      // Auto-speak if enabled
      if (voiceConfig.autoSpeak && lastAI.text && lastAI.text !== "__TYPING__") {
        speakText(lastAI.text);
      }
    }
  }

  autoTitle();
  saveThreads();
  busy = false;
  lockInput(false);
  if (remaining !== undefined) setStatus(`${remaining} messages left today`);
}

function lockInput(on) {
  ["inputTextarea", "micBtn", "sendBtn"].forEach(id => {
    document.getElementById(id).disabled = on;
  });
}

function showErr(msg) {
  const t = activeThread();
  if (!t) return;
  const last = t.messages[t.messages.length - 1];
  if (last?.text === "__TYPING__") last.text = `⚠️ ${msg}`;
  else t.messages.push({ role: "assistant", text: `⚠️ ${msg}` });
  saveThreads(); renderChat();
}

/* ════════════════════════════════════════════
   THREADS
════════════════════════════════════════════ */
function createThread() {
  const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
  threads.unshift({ id, title: "New Chat", messages: [], archived: false });
  saveThreads(); renderThreads(); openThread(id); closeSidebar();
}

function openThread(id) {
  activeId = id;
  stopSpeaking();
  renderThreads(); renderChat();
  const t = threads.find(x => x.id === id);
  if (t) document.getElementById("mobileTitle").textContent = t.title;
}

function renderThreads() {
  const aEl    = document.getElementById("threads");
  const arEl   = document.getElementById("archivedThreads");
  const arcSec = document.getElementById("archivedSection");
  const filter = (document.getElementById("chatSearch")?.value || "").toLowerCase();
  aEl.innerHTML = arEl.innerHTML = "";
  let hasArc = false;

  threads.filter(t => t.title.toLowerCase().includes(filter)).forEach(t => {
    const div = document.createElement("div");
    div.className = "thread" + (t.id === activeId ? " active" : "");
    div.innerHTML = `<span class="thread-ico">💬</span><span class="thread-label">${escHtml(t.title)}</span>`;

    div.onclick = (e) => {
      if (!div._longPressing) { openThread(t.id); closeSidebar(); }
      div._longPressing = false;
    };
    div.oncontextmenu = (e) => { e.preventDefault(); openCtx(t.id, e); };

    let longPressTimer;
    div.addEventListener("touchstart", () => {
      div._longPressing = false;
      longPressTimer = setTimeout(() => {
        div._longPressing = true;
        openCtxCenter(t.id);
        if (navigator.vibrate) navigator.vibrate(50);
      }, 520);
    }, { passive: true });
    div.addEventListener("touchend",    () => { clearTimeout(longPressTimer); setTimeout(() => { div._longPressing = false; }, 100); });
    div.addEventListener("touchcancel", () => { clearTimeout(longPressTimer); div._longPressing = false; });
    div.addEventListener("touchmove",   () => { clearTimeout(longPressTimer); div._longPressing = false; }, { passive: true });

    if (t.archived) { arEl.appendChild(div); hasArc = true; }
    else aEl.appendChild(div);
  });

  arcSec.style.display = hasArc ? "block" : "none";
}

function saveThreads() {
  const trim = threads.map(t => ({ ...t, messages: t.messages.slice(-200) }));
  try { localStorage.setItem("orbit_threads", JSON.stringify(trim)); }
  catch { threads = threads.slice(0, 20); localStorage.setItem("orbit_threads", JSON.stringify(threads)); }
}

function activeThread() { return threads.find(t => t.id === activeId); }

/* ════════════════════════════════════════════
   RENDER CHAT
════════════════════════════════════════════ */
function renderChat() {
  const chat = document.getElementById("chat");
  chat.innerHTML = "";
  const t = activeThread();
  if (!t) return;

  if (!t.messages.length) {
    const welcome = document.createElement("div");
    welcome.className = "welcome-container";
    welcome.innerHTML = `
      <div class="welcome-icon">🪐</div>
      <div>
        <div class="welcome-title">Ask Anything to Orbit AI</div>
        <div class="welcome-subtitle">Your intelligent assistant for creative ideas, coding help, analysis, and more</div>
      </div>
      <div class="suggested-prompts" id="suggestedPrompts"></div>`;
    chat.appendChild(welcome);

    const pc = document.getElementById("suggestedPrompts");
    SUGGESTED_PROMPTS.forEach(p => {
      const card = document.createElement("div");
      card.className = "prompt-card";
      card.innerHTML = `<div class="prompt-icon">${p.icon}</div><div class="prompt-text">${p.text}</div>`;
      card.onclick = () => {
        document.getElementById("inputTextarea").value = p.text;
        window._resizeTA?.();
        document.getElementById("inputTextarea").focus();
      };
      pc.appendChild(card);
    });
  } else {
    t.messages.forEach(m => chat.appendChild(makeBubble(m)));
    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([chat]).catch(() => {});
  }

  chat.scrollTop = chat.scrollHeight;
}

/* ════════════════════════════════════════════
   MAKE BUBBLE
════════════════════════════════════════════ */
function makeBubble(msg) {
  const wrap = document.createElement("div");
  wrap.className = "message-wrap " + msg.role;

  const div = document.createElement("div");
  div.className = "message " + msg.role;

  if (msg.text === "__TYPING__") {
    div.innerHTML = "<div class='typing'><span></span><span></span><span></span></div>";
  } else if (msg.text) {
    div.innerHTML = marked.parse(msg.text);
    applyDownloadLinks(div);
    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([div]).catch(() => {});
  }

  if (msg.images?.length) {
    const g = document.createElement("div");
    g.className = "gallery";
    msg.images.forEach(src => {
      if (!src) return;
      const img = document.createElement("img");
      img.src = src; img.loading = "lazy"; img.alt = "Generated image";
      img.onclick = () => window.open(src, "_blank");
      g.appendChild(img);
    });
    div.appendChild(g);
  }

  wrap.appendChild(div);
  if (msg.text !== "__TYPING__") wrap.appendChild(buildActionsBar(msg));
  return wrap;
}

/* ════════════════════════════════════════════
   ACTION BAR
════════════════════════════════════════════ */
function buildActionsBar(msg) {
  const bar = document.createElement("div");
  bar.className = "message-actions";

  /* ── 1. Read aloud (assistant messages only) ── */
  if (msg.role === "assistant" && msg.text && msg.text !== "__TYPING__") {
    const speakBtn = makeActionBtn("🔊", "Read", (btn) => {
      if (voiceSpeaking) {
        stopSpeaking();
        btn.innerHTML = `<span>🔊</span><span>Read</span>`;
        btn.classList.remove("speaking-btn");
        return;
      }
      btn.classList.add("speaking-btn");
      btn.innerHTML = `<span>⏹</span><span>Stop</span>`;
      speakText(msg.text).then(() => {
        // reset button after done (state already handled by setVoiceState)
        btn.innerHTML = `<span>🔊</span><span>Read</span>`;
        btn.classList.remove("speaking-btn");
      });
    });
    bar.appendChild(speakBtn);
  }

  /* ── 2. Copy Text ── */
  const copyBtn = makeActionBtn("📋", "Copy", async (btn) => {
    try {
      let text = msg.text || "";
      text = text.replace(/\*\*(.*?)\*\*/g, "$1").replace(/\*(.*?)\*/g, "$1").replace(/#{1,6} /g, "").trim();
      if (msg.images?.length) {
        text += "\n\n[Images: " + msg.images.length + "]";
        msg.images.forEach((u, i) => { if (!u.startsWith("data:")) text += `\nImage ${i + 1}: ${u}`; });
      }
      await navigator.clipboard.writeText(text);
      showBtnSuccess(btn, "Copied!");
      toast("Copied to clipboard!");
    } catch { toast("Couldn't copy — try selecting text manually."); }
  });
  bar.appendChild(copyBtn);

  /* ── 3. Share ── */
  const shareBtn = makeActionBtn("📤", "Share", async (btn) => {
    let text = (msg.text || "").replace(/\*\*(.*?)\*\*/g, "$1").replace(/\*(.*?)\*/g, "$1").replace(/#{1,6} /g, "").trim().substring(0, 800);
    if (navigator.share) {
      try { await navigator.share({ title: "Orbit AI", text }); showBtnSuccess(btn, "Shared!"); }
      catch (e) { if (e.name !== "AbortError") toast("Share failed — try Copy instead."); }
    } else {
      try { await navigator.clipboard.writeText(text); showBtnSuccess(btn, "Copied!"); toast("Copied! (Native share not available on this browser)"); }
      catch { toast("Share not supported on this browser."); }
    }
  });
  bar.appendChild(shareBtn);

  /* ── 4. Per-image buttons ── */
  if (msg.images?.length) {
    msg.images.forEach((imgUrl, i) => {
      if (!imgUrl) return;
      const suffix = msg.images.length > 1 ? ` ${i + 1}` : "";

      const dlBtn = makeActionBtn("⬇️", `Download${suffix}`, (btn) => {
        if (imgUrl.startsWith("data:")) {
          const a = document.createElement("a");
          a.href = imgUrl; a.download = `orbit-image-${Date.now()}.png`; a.click();
        } else { window.open(imgUrl, "_blank"); }
        showBtnSuccess(btn, "Saved!");
      });
      bar.appendChild(dlBtn);

      if (!imgUrl.startsWith("data:")) {
        const linkBtn = makeActionBtn("🔗", `Copy Link${suffix}`, async (btn) => {
          try { await navigator.clipboard.writeText(imgUrl); showBtnSuccess(btn, "Copied!"); toast("Image link copied!"); }
          catch { toast("Couldn't copy link."); }
        });
        bar.appendChild(linkBtn);

        if (navigator.share) {
          const shareImgBtn = makeActionBtn("📲", `Share Image${suffix}`, async (btn) => {
            try { await navigator.share({ title: "Orbit AI image", url: imgUrl }); showBtnSuccess(btn, "Shared!"); }
            catch (e) {
              if (e.name !== "AbortError") { window.open(imgUrl, "_blank"); toast("Opened in new tab."); }
            }
          });
          bar.appendChild(shareImgBtn);
        }
      }
    });
  }

  return bar;
}

function makeActionBtn(icon, label, onClick) {
  const btn = document.createElement("button");
  btn.className = "action-btn";
  btn._icon = icon; btn._label = label;
  btn.innerHTML = `<span>${icon}</span><span>${label}</span>`;
  btn.onclick = (e) => { e.stopPropagation(); onClick(btn); };
  return btn;
}

function showBtnSuccess(btn, successLabel) {
  btn.innerHTML = `<span>✓</span><span>${successLabel}</span>`;
  btn.classList.add("success");
  setTimeout(() => {
    btn.innerHTML = `<span>${btn._icon}</span><span>${btn._label}</span>`;
    btn.classList.remove("success");
  }, 2000);
}

/* ════════════════════════════════════════════
   AUTO-TITLE
════════════════════════════════════════════ */
function autoTitle() {
  const t = activeThread();
  if (!t || t.title !== "New Chat") return;
  const first = t.messages.find(m => m.role === "user" && m.text && m.text !== "(file sent)");
  if (first) {
    t.title = first.text.slice(0, 38).trim();
    document.getElementById("mobileTitle").textContent = t.title;
  }
  renderThreads();
}

/* ════════════════════════════════════════════
   PROFILE SHEET
════════════════════════════════════════════ */
function refreshProfileUI() {
  const name   = profile?.name  || "";
  const email  = profile?.email || "";
  const letter = name ? name[0].toUpperCase() : "?";
  document.getElementById("sidebarAvatar").textContent   = letter;
  document.getElementById("mobileAvatarBtn").textContent = letter;
  document.getElementById("sidebarName").textContent     = name  || "Set up profile";
  document.getElementById("sidebarEmail").textContent    = email || "";
}

function openSheet(force = false) {
  document.getElementById("profileModal").classList.add("open");
  document.getElementById("sheetTitle").textContent = force ? "Complete Your Profile" : "Edit Profile";
  if (profile) {
    document.getElementById("p_name").value       = profile.name       || "";
    document.getElementById("p_email").value      = profile.email      || "";
    document.getElementById("p_age").value        = profile.age        || "";
    document.getElementById("p_dob").value        = profile.dob        || "";
    document.getElementById("p_profession").value = profile.profession || "";
    document.getElementById("p_hobby").value      = profile.hobby      || "";
    document.getElementById("p_country").value    = profile.country    || "";
    document.getElementById("p_skills").value     = profile.skills     || "";
    document.getElementById("p_style").value      = profile.style      || "Professional";
  }
}

function closeSheet() { document.getElementById("profileModal").classList.remove("open"); }

function saveProfile() {
  const name  = document.getElementById("p_name").value.trim();
  const email = document.getElementById("p_email").value.trim();
  if (!name)  { toast("Name is required.");  return; }
  if (!email) { toast("Email is required."); return; }
  const dob = document.getElementById("p_dob").value;
  if (dob && new Date(dob) >= new Date()) { toast("DOB must be in the past."); return; }

  profile = {
    name, email,
    age:        document.getElementById("p_age").value.trim(),
    dob,
    profession: document.getElementById("p_profession").value.trim(),
    hobby:      document.getElementById("p_hobby").value.trim(),
    country:    document.getElementById("p_country").value.trim(),
    skills:     document.getElementById("p_skills").value.trim(),
    style:      document.getElementById("p_style").value,
  };

  localStorage.setItem("orbit_profile", JSON.stringify(profile));
  setCookie("orbit_name",  profile.name);
  setCookie("orbit_email", profile.email);
  refreshProfileUI();
  closeSheet();
  toast("Profile saved ✓");
}

document.getElementById("profileModal").addEventListener("click", (e) => {
  if (e.target === document.getElementById("profileModal"))
    if (profile?.name && profile?.email) closeSheet();
});

/* ════════════════════════════════════════════
   BIRTHDAY CHECK
════════════════════════════════════════════ */
function checkBirthday() {
  if (!profile?.dob) return;
  const today = new Date().toISOString().slice(0, 10);
  if (profile.dob.slice(5, 10) !== today.slice(5, 10)) return;
  if (localStorage.getItem("orbit_bday") === today) return;
  const t = activeThread();
  if (t) {
    t.messages.push({ role: "assistant", text: `🎉 Happy Birthday, **${profile.name}**! Hope it's amazing! 🎂` });
    saveThreads(); renderChat();
  }
  localStorage.setItem("orbit_bday", today);
}

/* ════════════════════════════════════════════
   CONTEXT MENU
════════════════════════════════════════════ */
let ctxId = null;

function openCtx(id, e) {
  ctxId = id;
  const m = document.getElementById("ctxMenu");
  m.style.transform = "";
  m.style.left    = Math.min(e.pageX, window.innerWidth  - 178) + "px";
  m.style.top     = Math.min(e.pageY, window.innerHeight - 155) + "px";
  m.style.display = "block";
  e.stopPropagation();
}

function openCtxCenter(id) {
  ctxId = id;
  const m = document.getElementById("ctxMenu");
  m.style.left = "50%"; m.style.top = "50%";
  m.style.transform = "translate(-50%, -50%)";
  m.style.display = "block";
  if (window.innerWidth <= 639) {
    const ov = document.getElementById("overlay");
    ov.classList.add("open"); ov._ctxOverlay = true;
  }
}

function closeCtx() {
  const m  = document.getElementById("ctxMenu");
  m.style.display = "none"; m.style.transform = "";
  const ov = document.getElementById("overlay");
  if (ov._ctxOverlay) { ov.classList.remove("open"); ov._ctxOverlay = false; }
}

function ctxAction(action) {
  const t = threads.find(x => x.id === ctxId);
  closeCtx();
  if (!t) return;

  if (action === "rename") {
    setTimeout(() => {
      const newName = prompt("Enter new chat name:", t.title);
      if (newName?.trim()) {
        t.title = newName.trim();
        saveThreads(); renderThreads();
        if (t.id === activeId) document.getElementById("mobileTitle").textContent = t.title;
        toast("Chat renamed ✓");
      }
    }, 100);
  }

  if (action === "archive") {
    t.archived = !t.archived;
    saveThreads(); renderThreads();
    toast(t.archived ? "Archived ✓" : "Unarchived ✓");
  }

  if (action === "delete") {
    setTimeout(() => {
      if (!confirm(`Delete "${t.title}" permanently?\n\nThis cannot be undone.`)) return;
      const deletedId = ctxId;
      threads = threads.filter(x => x.id !== deletedId);
      if (activeId === deletedId) {
        if (threads.length > 0) { openThread(threads[0].id); }
        else {
          const newId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
          threads.unshift({ id: newId, title: "New Chat", messages: [], archived: false });
          activeId = newId;
        }
      }
      saveThreads(); renderThreads(); renderChat();
      toast("Chat deleted ✓");
    }, 100);
  }
}

document.addEventListener("click", (e) => {
  const m = document.getElementById("ctxMenu");
  if (m.style.display === "block" && !m.contains(e.target)) closeCtx();
});
document.addEventListener("touchstart", (e) => {
  const m = document.getElementById("ctxMenu");
  if (m.style.display === "block" && !m.contains(e.target)) closeCtx();
}, { passive: true });

/* ════════════════════════════════════════════
   FILE UPLOAD
════════════════════════════════════════════ */
function triggerFile() { document.getElementById("fileInput").click(); }
function hidePreview()  { document.getElementById("previewBar").style.display = "none"; }

function clearPreview() {
  filePreview = fileId = null; fileIsImage = false;
  document.getElementById("fileInput").value = "";
  hidePreview();
}

document.getElementById("fileInput").onchange = async () => {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return;
  toast("Uploading…");
  const form = new FormData();
  form.append("file", file);
  try {
    const res  = await timedFetch(`${BACKEND}/upload`, { method: "POST", body: form }, 30000);
    const data = await res.json();
    if (!data.file_id) { toast("Upload failed."); return; }
    fileId = data.file_id; fileIsImage = file.type.startsWith("image/");
    toast("File ready ✓");
  } catch (e) { toast("Upload error: " + (e.message || "timeout")); return; }

  const bar = document.getElementById("previewBar");
  if (file.type.startsWith("image/")) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      filePreview = ev.target.result;
      const th = document.getElementById("prevThumb");
      th.src = filePreview; th.style.display = "block";
      document.getElementById("prevName").textContent = file.name;
      bar.style.display = "flex";
    };
    reader.readAsDataURL(file);
  } else {
    document.getElementById("prevThumb").style.display = "none";
    const icons = { pdf:"📄", xlsx:"📊", xls:"📊", docx:"📝", doc:"📝", pptx:"📊", ppt:"📊", csv:"📊", txt:"📄", xml:"📄" };
    const ext = file.name.split(".").pop().toLowerCase();
    document.getElementById("prevName").textContent = `${icons[ext] || "📎"} ${file.name}`;
    bar.style.display = "flex";
  }
};

const iw = document.getElementById("inputWrapper");
iw.addEventListener("dragover",  (e) => { e.preventDefault(); iw.classList.add("dragover"); });
iw.addEventListener("dragleave", ()  => iw.classList.remove("dragover"));
iw.addEventListener("drop", (e) => {
  e.preventDefault(); iw.classList.remove("dragover");
  if (e.dataTransfer.files.length) {
    document.getElementById("fileInput").files = e.dataTransfer.files;
    document.getElementById("fileInput").onchange();
  }
});

/* ════════════════════════════════════════════
   VOICE RECORDING (microphone input)
════════════════════════════════════════════ */
document.getElementById("micBtn").addEventListener("click", toggleMic);

async function toggleMic() {
  const btn                = document.getElementById("micBtn");
  const audioWave          = document.getElementById("audioWave");
  const recordingIndicator = document.getElementById("recordingIndicator");

  if (recorder?.state === "recording") { recorder.stop(); return; }

  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { toast("Microphone access denied."); return; }

  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };

  recorder.onstop = async () => {
    btn.classList.remove("recording");
    btn.textContent = "🎤";
    audioWave.classList.remove("active");
    recordingIndicator.classList.remove("active");
    document.getElementById("inputTextarea").placeholder = "Ask Orbit anything…";
    document.getElementById("inputTextarea").disabled    = false;
    stream.getTracks().forEach(tr => tr.stop());

    const blob = new Blob(chunks, { type: "audio/webm" });
    if (blob.size < 100) { recorder = null; return; }

    toast("Transcribing…");
    const form = new FormData();
    form.append("file", blob, "audio.webm");
    try {
      const res  = await timedFetch(`${BACKEND}/voice-to-text`, { method: "POST", body: form }, 20000);
      const data = await res.json();
      if (data.text) {
        const ta = document.getElementById("inputTextarea");
        ta.value = data.text;
        window._resizeTA?.();
        send();
      } else { toast("Nothing heard — try again."); }
    } catch (e) {
      toast("Voice error: " + (e.message || "timeout"));
    } finally { recorder = null; chunks = []; }
  };

  recorder.start();
  btn.classList.add("recording");
  btn.textContent = "⏹";

  const btnRect  = btn.getBoundingClientRect();
  const waveWidth = 9 * 4 + 8 * 3;
  audioWave.style.left = Math.max(4, btnRect.left - waveWidth - 8) + "px";
  audioWave.style.top  = (btnRect.top + btnRect.height / 2 - 14) + "px";
  audioWave.classList.add("active");

  recordingIndicator.style.bottom = (window.innerHeight - btnRect.top + 10) + "px";
  recordingIndicator.classList.add("active");

  document.getElementById("inputTextarea").placeholder = "Listening…";
  document.getElementById("inputTextarea").disabled    = true;

  setTimeout(() => { if (recorder?.state === "recording") recorder.stop(); }, 60000);
}

/* ════════════════════════════════════════════
   USER MEMORY
════════════════════════════════════════════ */
function updateUserMemory(userMessage, aiResponse) {
  userMemory.interactions = (userMemory.interactions || 0) + 1;
  userMemory.lastActive   = Date.now();
  if (userMessage) {
    const q = userMessage.toLowerCase();
    if (q.includes("how") || q.includes("what") || q.includes("why")) {
      userMemory.commonQuestions = userMemory.commonQuestions || [];
      userMemory.commonQuestions.push({ q: userMessage.substring(0, 100), timestamp: Date.now() });
      if (userMemory.commonQuestions.length > 20) userMemory.commonQuestions = userMemory.commonQuestions.slice(-20);
    }
  }
  localStorage.setItem("orbit_memory", JSON.stringify(userMemory));
}

/* ════════════════════════════════════════════
   UTILS
════════════════════════════════════════════ */
function escHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function toast(msg, ms = 2800) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), ms);
}

async function timedFetch(url, opts = {}, ms = 25000) {
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { ...opts, signal: ctrl.signal });
    clearTimeout(timer);
    return res;
  } catch (e) {
    clearTimeout(timer);
    if (e.name === "AbortError") throw new Error("Request timed out — server waking up, please retry");
    throw e;
  }
}
