services:
  - type: web
    name: alaada-workspaces
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r workspace-requirements.txt
    startCommand: python alaada_workspaces.py --host 0.0.0.0 --port $PORT --web-root .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APPWRITE_ENDPOINT
        value: https://sfo.cloud.appwrite.io/v1
      - key: APPWRITE_PROJECT_ID
        value: 6972444700208a437da1
      - key: APPWRITE_USERS_READ_KEY
        sync: false
      - key: APPWRITE_DATABASE_ID
        value: 6abe5c8c00331e943f9e
      - key: APPWRITE_API_KEY
        sync: false
      - key: APPWRITE_STORAGE_BUCKET_ID
        value: 69cbf6750039400951c0
      - key: APPWRITE_WEBHOOK_SECRET
        sync: false
      - key: APPWRITE_WEBHOOK_URL
        value: https://alaada-workspaces.onrender.com/api/appwrite/users-created
      - key: ALAADA_BILLING_ADAPTER_SECRET
        sync: false
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_WEBHOOK_KEY
        sync: false
      - key: DODO_PAYMENTS_ENVIRONMENT
        value: live_mode
      - key: DODO_ENABLE_CHECKOUT
        value: "false"
      - key: DODO_PRO_PRODUCT_ID
        sync: false
      - key: DODO_ELITE_PRODUCT_ID
        sync: false
      - key: ALAADA_ACCOUNTS_UPSTREAM
        sync: false
      - key: ALAADA_ACCOUNTS_GATEWAY_SECRET
        sync: false
      - key: ALAADA_ORBIT_UPSTREAM
        sync: false
      - key: ALAADA_ORBIT_API_KEY
        sync: false
      - key: ALAADA_ANALYSER_UPSTREAM
        sync: false
      - key: ALAADA_ANALYSER_GATEWAY_SECRET
        sync: false
      - key: ALAADA_SHEETS_UPSTREAM
        sync: false
      - key: ALAADA_CALCULATION_GATEWAY_SECRET
        sync: false
