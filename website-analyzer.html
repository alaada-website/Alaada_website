<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alaada Website Analyzer</title>
<style>
    body {
        background: #090d14;
        color: white;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 40px;
        text-align: center;
    }
    h1 {
        font-size: 42px;
        margin-bottom: 20px;
        color: #ff7f50;
    }
    #box {
        width: 60%;
        margin: auto;
        background: #111720;
        padding: 20px;
        border-radius: 14px;
        box-shadow: 0 0 20px rgba(255,127,80,0.2);
    }
    input {
        width: 80%;
        padding: 14px;
        border-radius: 8px;
        border: none;
        outline: none;
        font-size: 18px;
        margin-bottom: 20px;
        background: #1b2230;
        color: white;
    }
    button {
        padding: 14px 28px;
        background: #ff7f50;
        color: black;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 18px;
        font-weight: bold;
        transition: 0.3s;
    }
    button:hover { background: #ffa785; }
    button:disabled { background: #888; cursor: not-allowed; }
    #output {
        margin-top: 40px;
        text-align: left;
        padding: 20px;
        background: #1b2230;
        border-radius: 12px;
        white-space: pre-wrap;
        font-size: 16px;
        box-shadow: 0 0 16px rgba(255,127,80,0.15);
        min-height: 150px;
    }
    #loading {
        display: none;
        margin-top: 15px;
        font-size: 18px;
        color: #ff7f50;
    }
    .section-title {
        color: #ff7f50;
        font-weight: bold;
        font-size: 18px;
        margin-top: 20px;
        margin-bottom: 6px;
        border-bottom: 1px solid #ff7f5033;
        padding-bottom: 4px;
    }
    .ai-block {
        background: #0f1a2b;
        border-left: 3px solid #ff7f50;
        padding: 14px 18px;
        border-radius: 8px;
        margin-bottom: 20px;
        line-height: 1.7;
    }
    .score-badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 6px;
        font-weight: bold;
        font-size: 14px;
        margin-left: 8px;
    }
    .score-good { background: #1a3d2b; color: #4ade80; }
    .score-mid  { background: #3d2e00; color: #facc15; }
    .score-bad  { background: #3d1010; color: #f87171; }
</style>
</head>
<body>
<h1>Alaada Website Analyzer</h1>
<div id="box">
    <input type="text" id="urlInput" placeholder="Enter website URL (https://example.com)">
    <br>
    <button id="analyzeBtn" onclick="analyze()">Analyze Website</button>
    <div id="loading">⏳ Analyzing... please wait</div>
</div>
<div id="output"></div>

<script>
function scoreBadge(score) {
    const cls = score >= 70 ? "score-good" : score >= 40 ? "score-mid" : "score-bad";
    return `<span class="score-badge ${cls}">${score}/100</span>`;
}

function section(title, score, lines) {
    return `
        <div class="section-title">${title} ${score !== undefined ? scoreBadge(score) : ""}</div>
        <div style="padding: 8px 4px; line-height: 1.8;">${lines.join("<br>")}</div>
    `;
}

function renderResult(data) {
    const s = data.summary;
    const out = [];

    // AI Summary
    out.push(`<div class="section-title">🤖 Orbit AI Summary</div>`);
    out.push(`<div class="ai-block">${data.ai_summary.replace(/\n/g, "<br>")}</div>`);

    // Overview
    out.push(section("📄 Page Overview", undefined, [
        `URL: ${s.url}`,
        `Title: ${s.title || "—"}`,
        `HTML Size: ${s.html_size_kb} KB`,
        `Load Time: ${s.timings_ms?.total_ms ?? "—"} ms`,
    ]));

    // SEO
    out.push(section("🔍 SEO", s.seo.score, [
        `Meta Description: ${s.seo.meta_description || "❌ Missing"}`,
        `Canonical: ${s.seo.canonical || "❌ Missing"}`,
        `H1 Tags: ${s.seo.h1_count}`,
        `Issues: ${s.seo.issues.length ? s.seo.issues.join(", ") : "✅ None"}`,
    ]));

    // Security
    out.push(section("🔒 Security", s.security.score, [
        `Issues: ${s.security.issues.length ? s.security.issues.join(" | ") : "✅ None"}`,
        `Forms: ${s.security.forms_count}`,
        `iFrames: ${s.security.iframes_count}`,
        `Scripts without SRI: ${s.security.external_scripts_no_sri?.length ?? 0}`,
    ]));

    // Accessibility
    out.push(section("♿ Accessibility", s.accessibility.score, [
        `Issues: ${s.accessibility.issues.length ? s.accessibility.issues.join(" | ") : "✅ None"}`,
        `Images without alt: ${s.accessibility.images_without_alt}`,
        `Empty buttons: ${s.accessibility.empty_buttons}`,
        `Empty links: ${s.accessibility.empty_links}`,
    ]));

    // Resources
    out.push(section("📦 Resources", undefined, [
        `Images: ${s.resources.images_count} (Est. ${s.resources.images_total_kb_est} KB)`,
        `Large images (>200KB): ${s.resources.large_images_count}`,
        `Scripts: ${s.resources.scripts_count} (3rd party: ${s.resources.script_third_party_count})`,
        `CSS files: ${s.resources.css_count} | Fonts: ${s.resources.fonts_count}`,
    ]));

    // DOM
    out.push(section("🌳 DOM", s.dom.cleanliness_score, [
        `Depth: ${s.dom.dom_depth} | Nodes: ${s.dom.total_nodes}`,
        `Inline styles: ${s.dom.inline_styles_count} | Empty tags: ${s.dom.empty_tags_count}`,
        `Warnings: ${s.dom.repetition_warnings.length ? s.dom.repetition_warnings.join("; ") : "✅ None"}`,
    ]));

    // Tech Stack
    out.push(section("⚙️ Tech Stack", undefined, [
        s.tech_stack.detected.length ? s.tech_stack.detected.join(", ") : "Not detected",
    ]));

    return out.join("");
}

async function analyze() {
    const url = document.getElementById("urlInput").value.trim();
    const output = document.getElementById("output");
    const loading = document.getElementById("loading");
    const btn = document.getElementById("analyzeBtn");

    if (!url) {
        output.innerHTML = "❌ Please enter a valid URL.";
        return;
    }

    loading.style.display = "block";
    output.innerHTML = "";
    btn.disabled = true;

    try {
        const res = await fetch("https://alaada-analyzer.onrender.com/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url })
        });

        const data = await res.json();

        if (data.error) {
            output.innerHTML = `❌ Error: ${data.error}`;
        } else {
            // FIX: was data.result — backend returns data.ai_summary + data.summary
            output.innerHTML = renderResult(data);
        }
    } catch (err) {
        output.innerHTML = `❌ Network error: ${err.message}<br><br>
            <small>Check: Is the backend running at alaada-analyzer.onrender.com?<br>
            Render free tier spins down after inactivity — first request may take 30–60s.</small>`;
    } finally {
        loading.style.display = "none";
        btn.disabled = false;
    }
}

// Allow Enter key
document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("urlInput").addEventListener("keydown", e => {
        if (e.key === "Enter") analyze();
    });
});
</script>
</body>
</html>
