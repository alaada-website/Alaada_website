<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accept invitation · Alaada</title><style>body{margin:0;background:#f5f4ef;color:#242321;font:15px system-ui,sans-serif}.card{max-width:470px;margin:14vh auto;padding:28px 22px;background:#fffdf8;border:1px solid #dedbd2;border-radius:18px;text-align:center}button{padding:11px 16px;border:0;border-radius:9px;background:#242321;color:#fff;font:inherit;cursor:pointer}.muted{color:#77746d}.error{color:#b33c35}</style></head><body><main class="card"><h1>Join your Alaada team</h1><p id="message" class="muted">Checking your invitation…</p><button id="accept" hidden>Accept invitation</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.ALAADA_CONFIG=window.ALAADA_CONFIG||{};</script><script src="js/alaada-ums.js"></script><script>const m=document.getElementById('message'),b=document.getElementById('accept'),token=new URLSearchParams(location.hash.slice(1)).get('token');async function boot(){if(!token){m.textContent='This invitation link is invalid.';m.className='error';return}if(!window.AlaadaUMS){m.textContent='Alaada account services are not configured.';return}await AlaadaUMS.refresh();if(!AlaadaUMS.user){m.textContent='Sign in or create your Alaada account, then return to this link.';b.hidden=false;b.textContent='Open account';b.onclick=()=>location.href='/account.html';return}b.hidden=false;b.onclick=async()=>{b.disabled=true;const r=await AlaadaUMS.acceptInvitation(token);if(r.error){m.textContent=r.error.message;b.disabled=false;m.className='error';return}m.textContent='Invitation accepted. Opening your account…';location.href='/account.html'};m.textContent='You are signed in as '+(AlaadaUMS.user.email||'your Alaada account')+'.' }boot();</script></body></html>
