<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f5f4ef">
  <title>Accept invitation · Alaada</title>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f4ef;color:#242321;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,480px);padding:30px 26px;background:#fffdf8;border:1px solid #dedbd2;border-radius:18px;box-shadow:0 12px 36px #24232110}.brand{font-weight:750;letter-spacing:.02em;color:#222;margin:0 0 22px}h1{font-size:26px;line-height:1.2;margin:0 0 12px}.muted{color:#706d66}.error{color:#ae342e}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button,.link{min-height:44px;padding:10px 16px;border:0;border-radius:9px;background:#242321;color:#fff;font:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.secondary{background:#ebe7dc;color:#242321}button:disabled{opacity:.55;cursor:wait}.hidden{display:none!important}
  </style>
</head>
<body>
  <main class="card">
    <p class="brand">Alaada</p>
    <h1>Join your Enterprise workspace</h1>
    <p id="message" class="muted" role="status" aria-live="polite">Checking your Appwrite invitation…</p>
    <div class="actions"><button id="accept" class="hidden" type="button">Accept invitation</button><a id="sign-in" class="link hidden" href="/auth.html?next=%2Faccept-invitation.html">Sign in</a><button id="switch-account" class="secondary hidden" type="button">Switch account</button></div>
  </main>
  <script>
    'use strict';
    const ENDPOINT='https://sfo.cloud.appwrite.io/v1',PROJECT='6972444700208a437da1',KEY='alaada-team-invitation';
    const $=id=>document.getElementById(id),query=new URLSearchParams(location.search),fragment=new URLSearchParams(location.hash.slice(1)),stored=(()=>{try{return JSON.parse(sessionStorage.getItem(KEY)||'null')}catch{return null}})();
    const invite={teamId:query.get('teamId')||query.get('team')||stored?.teamId,membershipId:query.get('membershipId')||query.get('inviteId')||stored?.membershipId,userId:query.get('userId')||stored?.userId,secret:query.get('secret')||stored?.secret};
    // The invitation secret stays in tab-scoped storage, never in a login URL.
    function authUrl(){return '/auth.html?next=%2Faccept-invitation.html'}
    function persistAndClean(){if(invite.teamId&&invite.membershipId&&invite.userId&&invite.secret){sessionStorage.setItem(KEY,JSON.stringify(invite));history.replaceState(null,'',location.pathname)}else if(fragment.get('teamId')&&(fragment.get('inviteId')||fragment.get('membershipId'))){Object.assign(invite,{teamId:fragment.get('teamId'),membershipId:fragment.get('membershipId')||fragment.get('inviteId'),userId:fragment.get('userId'),secret:fragment.get('secret')});if(invite.teamId&&invite.membershipId&&invite.userId&&invite.secret){sessionStorage.setItem(KEY,JSON.stringify(invite));history.replaceState(null,'',location.pathname)}}$('sign-in').href=authUrl()}
    async function readUMSResponse(response,service,allowEmpty=false){
      let data=null;const raw=await response.text();
      try{data=raw.trim()?JSON.parse(raw):null}catch{}
      if(!response.ok){
        const detail=typeof data?.detail==='string'?data.detail:typeof data?.message==='string'?data.message:'';
        const error=new Error(detail.slice(0,300)||service+' request failed (HTTP '+response.status+').');
        error.status=response.status;error.code=response.status;throw error;
      }
      if(response.status===204 && allowEmpty)return {};
      if(!data || typeof data!=='object'){
        const error=new Error(service+(raw.trim()?' returned an unreadable response.':' returned an empty response.')+' Reload to check the result before retrying.');
        error.status=502;error.code=502;error.reason=raw.trim()?'MALFORMED_RESPONSE':'EMPTY_RESPONSE';throw error;
      }
      return data;
    }
    function verifyAppwriteShape(data,path){
      const field=path==='/account'?'$id':path==='/account/jwts'?'jwt':null;
      if(field && (typeof data[field]!=='string'||!data[field].trim())){
        const error=new Error('Appwrite returned an incomplete '+(field==='jwt'?'session token':'account')+'. Reload and retry.');
        error.status=502;error.code=502;throw error;
      }
      return data;
    }
    async function appwrite(path,method='GET',body){const response=await fetch(ENDPOINT+path,{method,credentials:'include',cache:'no-store',redirect:'error',signal:AbortSignal.timeout(25000),headers:{'X-Appwrite-Project':PROJECT,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});return verifyAppwriteShape(await readUMSResponse(response,'Appwrite',method==='DELETE'),path)}
    function showError(message){$('message').textContent=message;$('message').className='error'}
    async function boot(){
      persistAndClean();
      if(!invite.teamId||!invite.membershipId||!invite.userId||!invite.secret){showError('This invitation link is incomplete or expired. Ask the Enterprise workspace owner to send a new invitation.');return}
      let account;
      try{account=await appwrite('/account')}catch(error){if(error.status!==401)throw error;}
      if(!account){$('message').textContent='Sign in with the email address that received this invitation. Your personal workspace and subscription remain separate.';$('sign-in').classList.remove('hidden');return}
      if(account.$id!==invite.userId){
        $('message').textContent=`You are signed in as ${account.email}. Sign out and use the account that received this invitation.`;
        $('switch-account').classList.remove('hidden');
        $('switch-account').onclick=async()=>{
          const button=$('switch-account');if(button.disabled)return;button.disabled=true;
          try{await appwrite('/account/sessions/current','DELETE');location.href=authUrl()}
          catch(error){if(error.status===401)location.href=authUrl();else showError('Could not confirm sign-out. '+error.message);}
          finally{button.disabled=false}
        };return;
      }
      $('message').textContent=`Signed in as ${account.email}. Accepting this invitation will add an Enterprise workspace while keeping your personal workspace separate.`;
      $('accept').classList.remove('hidden');
      $('accept').onclick=async()=>{
        const button=$('accept');if(button.disabled)return;button.disabled=true;button.textContent='Accepting…';
        try{
          if((await appwrite('/account')).$id!==invite.userId)throw Error('Your account changed. Reload before accepting this invitation.');
          const membership=await appwrite(`/teams/${encodeURIComponent(invite.teamId)}/memberships/${encodeURIComponent(invite.membershipId)}/status`,'PATCH',{userId:invite.userId,secret:invite.secret});
          if(membership.$id!==invite.membershipId||membership.teamId!==invite.teamId||membership.userId!==invite.userId||membership.confirm!==true)throw Error('Appwrite did not confirm this membership. Reload to check your invitation.');
          if((await appwrite('/account')).$id!==invite.userId)throw Error('Your account changed. Reload to check your invitation.');
          sessionStorage.removeItem(KEY);$('message').textContent='Invitation accepted. Connecting your Enterprise workspace…';button.classList.add('hidden');
          let workspaceId='';
          try{
            const jwt=await appwrite('/account/jwts','POST'),response=await fetch('/api/workspaces',{cache:'no-store',redirect:'error',signal:AbortSignal.timeout(40000),headers:{Authorization:'Bearer '+jwt.jwt}});
            const data=await readUMSResponse(response,'Workspace service');
            if(data.user!==invite.userId||!Array.isArray(data.workspaces))throw Error('Workspace identity could not be verified.');
            workspaceId=data.workspaces.find(item=>item.kind==='organisation'&&item.team===invite.teamId)?.id||'';
          }catch{/* The account page can reconnect after confirmed membership acceptance. */}
          location.assign('/account.html'+(workspaceId?'?workspace='+encodeURIComponent(workspaceId):''));
        }catch(error){showError(error.message||'Could not accept this invitation. Request a fresh invitation and try again.');button.disabled=false;button.textContent='Accept invitation'}
      };
    }
    boot().catch(error=>showError(error.message||'Could not load this invitation.'));
  </script>
</body>
</html>
