<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blog — Alaada | AI Insights, Product Updates & More</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="icon" type="image/jpeg" href="images/alaada-logo.jpg"/>
  <meta name="description" content="The Alaada blog — product updates, AI insights, how-to guides, and behind-the-scenes from building India's AI business ecosystem."/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Figtree:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#f5f4ef;--bg2:#eceae3;--white:#ffffff;
    --ink:#121110;--ink2:#46443f;--ink3:#97948d;
    --border:rgba(0,0,0,0.07);--borderM:rgba(0,0,0,0.13);
    --blue:#1a5fff;--blue2:#e6edff;--blue3:rgba(26,95,255,0.1);
    --teal:#00957a;--teal2:#dcf5ef;--teal3:rgba(0,149,122,0.1);
    --gold:#d4930a;--gold2:#fdf3d9;--gold3:rgba(212,147,10,0.1);
    --r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:28px;
    --sh-sm:0 1px 3px rgba(0,0,0,0.05),0 4px 14px rgba(0,0,0,0.06);
    --sh-md:0 2px 6px rgba(0,0,0,0.05),0 10px 36px rgba(0,0,0,0.09);
    --sh-lg:0 4px 12px rgba(0,0,0,0.05),0 24px 64px rgba(0,0,0,0.12);
  }
  html{scroll-behavior:smooth;}
  body{font-family:'Figtree',sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;line-height:1.65;-webkit-font-smoothing:antialiased;}

  /* NAV */
  nav{position:fixed;top:0;left:0;right:0;z-index:300;height:60px;background:rgba(245,244,239,0.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 40px;}
  .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Syne',sans-serif;font-weight:800;font-size:1.18rem;color:var(--ink);letter-spacing:-0.4px;cursor:pointer;}
  .nav-logo-icon{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--blue),var(--teal));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.8rem;flex-shrink:0;}
  .nav-logo img{width:28px;height:28px;border-radius:7px;object-fit:cover;flex-shrink:0;}
  .nav-links{display:flex;align-items:center;gap:4px;list-style:none;}
  .nav-links a,.nav-links button{font-size:.875rem;font-weight:500;color:var(--ink2);text-decoration:none;padding:6px 13px;border-radius:var(--r-sm);transition:background .15s,color .15s;cursor:pointer;background:none;border:none;font-family:'Figtree',sans-serif;}
  .nav-links a:hover,.nav-links button:hover,.nav-links a.active{background:var(--bg2);color:var(--ink);}
  .nav-cta{background:var(--blue)!important;color:#fff!important;font-weight:600!important;box-shadow:0 2px 10px rgba(26,95,255,.28)!important;}
  .nav-cta:hover{background:#1450d6!important;}
  @media(max-width:640px){nav{padding:0 18px;}.nav-links{display:none;}}

  /* HERO */
  .blog-hero{padding:120px 80px 64px;position:relative;overflow:hidden;max-width:1200px;margin:0 auto;}
  .hero-dots{position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle,rgba(0,0,0,.08) 1px,transparent 1px);background-size:30px 30px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,black 30%,transparent 80%);}
  .hero-blob{position:absolute;width:500px;height:400px;background:radial-gradient(circle,rgba(26,95,255,.07),transparent 70%);top:-80px;right:-100px;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;}
  .blog-hero-inner{position:relative;z-index:2;max-width:680px;}
  .page-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink2);background:var(--white);border:1px solid var(--borderM);padding:5px 14px;border-radius:100px;margin-bottom:26px;box-shadow:var(--sh-sm);}
  .page-eyebrow-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex-shrink:0;}
  .blog-hero h1{font-family:'Syne',sans-serif;font-size:clamp(2.4rem,4vw,3.6rem);font-weight:800;line-height:1.06;letter-spacing:-2px;color:var(--ink);margin-bottom:16px;}
  .accent{background:linear-gradient(110deg,var(--blue) 0%,#4d8bff 50%,var(--teal) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .blog-hero-sub{font-size:1rem;color:var(--ink2);line-height:1.8;max-width:520px;}
  @media(max-width:760px){.blog-hero{padding:100px 24px 48px;}}

  /* FILTER */
  .filter-bar{padding:0 80px;max-width:1200px;margin:0 auto;}
  .filter-inner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--border);}
  .filter-label{font-size:.72rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-right:6px;}
  .filter-btn{font-size:.76rem;font-weight:600;padding:5px 13px;border-radius:100px;border:1.5px solid var(--borderM);background:var(--white);color:var(--ink2);cursor:pointer;transition:all .15s;font-family:'Figtree',sans-serif;}
  .filter-btn:hover{border-color:rgba(0,0,0,.22);color:var(--ink);}
  .filter-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  @media(max-width:760px){.filter-bar{padding:0 24px;}}

  /* BLOG LAYOUT */
  .blog-layout{max-width:1200px;margin:0 auto;padding:52px 80px 80px;display:grid;grid-template-columns:1fr 300px;gap:48px;align-items:start;}
  @media(max-width:960px){.blog-layout{grid-template-columns:1fr;padding:48px 24px 72px;}}

  /* FEATURED */
  .featured-post{background:var(--white);border:1px solid var(--borderM);border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-lg);margin-bottom:32px;cursor:pointer;display:block;transition:transform .22s,box-shadow .22s;}
  .featured-post:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(0,0,0,.13);}
  .featured-banner{height:200px;background:linear-gradient(135deg,var(--blue) 0%,#4d8bff 50%,var(--teal) 100%);position:relative;display:flex;align-items:flex-end;padding:24px 30px;}
  .featured-banner-emoji{position:absolute;top:24px;right:28px;font-size:3rem;opacity:.35;}
  .featured-badge{display:inline-flex;align-items:center;gap:6px;font-size:.62rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.18);padding:4px 11px;border-radius:100px;backdrop-filter:blur(6px);}
  .featured-post-body{padding:28px 30px 30px;}
  .post-meta{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap;}
  .post-tag{font-size:.65rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:100px;}
  .tag-product{background:var(--blue2);color:var(--blue);}
  .tag-insight{background:var(--teal2);color:var(--teal);}
  .tag-guide{background:var(--gold2);color:var(--gold);}
  .tag-story{background:var(--bg2);color:var(--ink3);}
  .post-date,.post-read{font-size:.72rem;color:var(--ink3);}
  .featured-title{font-family:'Syne',sans-serif;font-size:1.45rem;font-weight:800;letter-spacing:-.5px;color:var(--ink);line-height:1.25;margin-bottom:10px;}
  .featured-excerpt{font-size:.9rem;color:var(--ink2);line-height:1.75;margin-bottom:20px;}
  .post-footer{display:flex;align-items:center;justify-content:space-between;}
  .post-author{display:flex;align-items:center;gap:9px;}
  .author-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;font-family:'Syne',sans-serif;font-weight:800;font-size:.68rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .author-name{font-size:.78rem;font-weight:600;color:var(--ink2);}
  .read-link{font-size:.78rem;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:4px;}

  /* POSTS GRID */
  .posts-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:32px;}
  @media(max-width:600px){.posts-grid{grid-template-columns:1fr;}}
  .post-card{background:var(--white);border:1px solid var(--borderM);border-radius:var(--r-xl);padding:24px;box-shadow:var(--sh-sm);cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;}
  .post-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px;}
  .post-card.blue::before{background:var(--blue);}
  .post-card.teal::before{background:var(--teal);}
  .post-card.gold::before{background:var(--gold);}
  .post-card.ink::before{background:var(--ink);}
  .post-card:hover{transform:translateY(-4px);box-shadow:var(--sh-md);}
  .post-card-emoji{font-size:1.4rem;}
  .post-card-title{font-family:'Syne',sans-serif;font-size:.98rem;font-weight:800;letter-spacing:-.3px;color:var(--ink);line-height:1.35;flex:1;}
  .post-card-excerpt{font-size:.8rem;color:var(--ink2);line-height:1.65;}
  .post-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}

  /* OLDER POSTS */
  .older-posts-label{font-family:'Syne',sans-serif;font-size:.78rem;font-weight:700;color:var(--ink3);letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
  .older-posts-label span:last-child{flex:1;height:1px;background:var(--border);}
  .older-posts-list{border:1px solid var(--borderM);border-radius:var(--r-lg);overflow:hidden;background:var(--white);}
  .older-post-item{display:flex;align-items:center;gap:16px;padding:16px 20px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s;}
  .older-post-item:last-child{border-bottom:none;}
  .older-post-item:hover{background:var(--bg);}
  .older-post-emoji{font-size:1.1rem;flex-shrink:0;}
  .older-post-title{font-family:'Syne',sans-serif;font-size:.88rem;font-weight:700;color:var(--ink);margin-bottom:2px;}
  .older-post-meta{font-size:.74rem;color:var(--ink3);}

  /* SIDEBAR */
  .sidebar{display:flex;flex-direction:column;gap:20px;position:sticky;top:80px;}
  .sidebar-card{background:var(--white);border:1px solid var(--borderM);border-radius:var(--r-xl);padding:24px;box-shadow:var(--sh-sm);}
  .sidebar-title{font-family:'Syne',sans-serif;font-size:.9rem;font-weight:800;color:var(--ink);margin-bottom:16px;letter-spacing:-.2px;}
  .newsletter-form{display:flex;flex-direction:column;gap:10px;}
  .newsletter-input{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r-sm);padding:9px 12px;font-family:'Figtree',sans-serif;font-size:.84rem;color:var(--ink);outline:none;transition:border-color .18s;width:100%;}
  .newsletter-input:focus{border-color:var(--blue);background:var(--white);}
  .newsletter-input::placeholder{color:var(--ink3);}
  .newsletter-btn{background:var(--blue);color:#fff;border:none;border-radius:var(--r-sm);padding:10px;font-family:'Syne',sans-serif;font-weight:700;font-size:.82rem;cursor:pointer;transition:background .15s;}
  .newsletter-btn:hover{background:#1450d6;}
  .newsletter-note{font-size:.68rem;color:var(--ink3);line-height:1.5;}
  .popular-list{display:flex;flex-direction:column;gap:4px;}
  .popular-item{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:var(--r-md);transition:background .15s;cursor:pointer;}
  .popular-item:hover{background:var(--bg);}
  .popular-num{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;color:var(--borderM);flex-shrink:0;line-height:1.2;}
  .popular-title{font-size:.8rem;font-weight:600;color:var(--ink);line-height:1.4;margin-bottom:3px;}
  .popular-meta{font-size:.68rem;color:var(--ink3);}
  .tags-cloud{display:flex;flex-wrap:wrap;gap:7px;}
  .tag-cloud-item{font-size:.69rem;font-weight:600;padding:4px 11px;border-radius:100px;background:var(--bg2);color:var(--ink3);cursor:pointer;transition:background .15s,color .15s;}
  .tag-cloud-item:hover{background:var(--blue2);color:var(--blue);}
  .about-sidebar-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;display:flex;align-items:center;justify-content:center;}
  .about-sidebar-name{font-family:'Syne',sans-serif;font-size:.9rem;font-weight:700;color:var(--ink);margin-top:10px;}
  .about-sidebar-bio{font-size:.78rem;color:var(--ink2);line-height:1.65;margin-top:6px;}
  .about-sidebar-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .as-link{font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:100px;background:var(--bg2);color:var(--ink3);text-decoration:none;transition:background .15s,color .15s;}
  .as-link:hover{background:var(--blue2);color:var(--blue);}

  /* POST VIEW */
  .post-view{max-width:1200px;margin:0 auto;padding:90px 80px 80px;}
  .post-view-inner{max-width:720px;margin:0 auto;}
  .back-btn{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;color:var(--ink2);padding:7px 14px;border-radius:var(--r-sm);border:1.5px solid var(--borderM);background:var(--white);margin-bottom:32px;cursor:pointer;transition:all .15s;font-family:'Figtree',sans-serif;}
  .back-btn:hover{border-color:rgba(0,0,0,.22);color:var(--ink);}
  .post-view-banner{height:180px;background:linear-gradient(135deg,var(--blue) 0%,#4d8bff 50%,var(--teal) 100%);border-radius:var(--r-xl);margin-bottom:32px;display:flex;align-items:center;justify-content:center;font-size:4rem;}
  .post-view-title{font-family:'Syne',sans-serif;font-size:clamp(1.8rem,3vw,2.4rem);font-weight:800;letter-spacing:-1px;color:var(--ink);line-height:1.15;margin:16px 0 20px;}
  .post-view-meta{display:flex;align-items:center;gap:14px;margin-bottom:36px;padding-bottom:24px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .post-view-content{font-size:1rem;color:var(--ink2);line-height:1.85;}
  .post-view-content p{margin-bottom:1.4em;}
  .post-view-content h2{font-family:'Syne',sans-serif;font-size:1.25rem;font-weight:800;color:var(--ink);margin:2em 0 .8em;letter-spacing:-.3px;}
  .post-view-content h3{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:700;color:var(--ink);margin:1.5em 0 .6em;}
  .related-section{margin-top:56px;padding-top:40px;border-top:1px solid var(--border);}
  .related-label{font-family:'Syne',sans-serif;font-size:.78rem;font-weight:700;color:var(--ink3);letter-spacing:1px;text-transform:uppercase;margin-bottom:20px;}
  .related-card{display:flex;gap:14px;align-items:flex-start;padding:16px;background:var(--white);border:1px solid var(--borderM);border-radius:var(--r-lg);cursor:pointer;transition:box-shadow .18s,transform .18s;margin-bottom:12px;}
  .related-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px);}
  .related-card-emoji{font-size:1.5rem;flex-shrink:0;}
  .related-card-title{font-family:'Syne',sans-serif;font-size:.9rem;font-weight:700;color:var(--ink);margin-bottom:4px;}
  .related-card-meta{font-size:.76rem;color:var(--ink3);}
  @media(max-width:760px){.post-view{padding:80px 24px 60px;}}

  /* ADMIN LOGIN */
  .admin-login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 24px;}
  .admin-login-card{background:var(--white);border:1px solid var(--borderM);border-radius:var(--r-xl);padding:40px;max-width:380px;width:100%;box-shadow:var(--sh-lg);}
  .admin-login-title{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;color:var(--ink);margin-bottom:6px;}
  .admin-login-sub{font-size:.84rem;color:var(--ink3);margin-bottom:24px;line-height:1.6;}
  .admin-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r-sm);padding:11px 14px;font-family:'Figtree',sans-serif;font-size:.9rem;color:var(--ink);outline:none;transition:border-color .18s;margin-bottom:12px;}
  .admin-input:focus{border-color:var(--blue);background:var(--white);}
  .admin-btn-primary{width:100%;background:var(--blue);color:#fff;border:none;border-radius:var(--r-sm);padding:12px;font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;transition:background .15s;}
  .admin-btn-primary:hover{background:#1450d6;}
  .error-msg{color:#dc2626;font-size:.8rem;margin-top:8px;}

  /* ADMIN PANEL */
  .admin-panel{max-width:1140px;margin:0 auto;padding:80px 40px 80px;}
  .admin-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:32px;gap:16px;}
  .admin-title{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;color:var(--ink);}
  .admin-stats{font-size:.82rem;color:var(--ink3);margin-top:4px;}
  .admin-logout{font-size:.8rem;font-weight:600;color:var(--ink3);padding:7px 14px;border-radius:var(--r-sm);border:1.5px solid var(--borderM);background:var(--white);cursor:pointer;transition:all .15s;font-family:'Figtree',sans-serif;white-space:nowrap;}
  .admin-logout:hover{color:var(--ink);}
  .admin-grid{display:grid;grid-template-columns:1fr 400px;gap:32px;align-items:start;}
  @media(max-width:960px){.admin-grid{grid-template-columns:1fr;}.admin-panel{padding:80px 24px 60px;}}
  .admin-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .admin-section-label{font-family:'Syne',sans-serif;font-size:.88rem;font-weight:700;color:var(--ink2);}
  .btn-new{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:7px 14px;border-radius:var(--r-sm);background:var(--blue);color:#fff;border:none;cursor:pointer;transition:background .15s;font-family:'Syne',sans-serif;}
  .btn-new:hover{background:#1450d6;}
  .admin-posts-list{display:flex;flex-direction:column;gap:10px;}
  .admin-post-item{background:var(--white);border:1px solid var(--borderM);border-radius:var(--r-lg);padding:16px 18px;display:flex;align-items:flex-start;gap:12px;box-shadow:var(--sh-sm);}
  .admin-post-item.is-featured{border-color:var(--blue);background:var(--blue3);}
  .admin-post-emoji{font-size:1.3rem;flex-shrink:0;margin-top:2px;}
  .admin-post-info{flex:1;min-width:0;}
  .admin-post-title{font-family:'Syne',sans-serif;font-size:.88rem;font-weight:700;color:var(--ink);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .admin-post-meta{font-size:.72rem;color:var(--ink3);margin-bottom:10px;}
  .admin-post-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .action-btn{font-size:.7rem;font-weight:600;padding:4px 10px;border-radius:var(--r-sm);border:1.5px solid var(--borderM);background:var(--white);color:var(--ink2);cursor:pointer;transition:all .15s;font-family:'Figtree',sans-serif;}
  .action-btn:hover{background:var(--bg2);color:var(--ink);}
  .action-btn.danger{border-color:#fecaca;color:#dc2626;}
  .action-btn.danger:hover{background:#fef2f2;}
  .action-btn.accent{background:var(--blue);border-color:var(--blue);color:#fff;}
  .action-btn.accent:hover{background:#1450d6;}
  .action-btn.star{border-color:var(--gold3);color:var(--gold);}
  .action-btn.star:hover{background:var(--gold2);}
  .featured-pill{display:inline-flex;align-items:center;gap:3px;font-size:.58rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;background:var(--blue2);color:var(--blue);padding:2px 7px;border-radius:100px;margin-left:5px;vertical-align:middle;}
  .admin-form-card{background:var(--white);border:1px solid var(--borderM);border-radius:var(--r-xl);padding:28px;box-shadow:var(--sh-md);position:sticky;top:80px;}
  .admin-form-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;color:var(--ink);margin-bottom:20px;}
  .form-field{margin-bottom:14px;}
  .form-label{display:block;font-size:.74rem;font-weight:600;color:var(--ink2);margin-bottom:5px;}
  .form-input,.form-textarea,.form-select{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r-sm);padding:9px 12px;font-family:'Figtree',sans-serif;font-size:.86rem;color:var(--ink);outline:none;transition:border-color .18s;}
  .form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--blue);background:var(--white);}
  .form-textarea{resize:vertical;min-height:120px;line-height:1.6;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .form-checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .form-checkbox{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;}

    excerpt:"Virtual scroll, formula parsing, multi-sheet state management — the honest story of building Alaada Sheets solo with no prior spreadsheet experience.",
    content:`I had never built a spreadsheet before.

That's not an exaggeration. When I started Alaada Sheets, my spreadsheet experience was "user of Google Sheets." I had no idea how virtual scroll worked, how formula parsing was implemented, or how multi-sheet state management was handled at scale.

Twelve months later, Alaada Sheets handles thousands of cells, complex formulas, and Tally XML export. Here's what I learned.

## Virtual Scroll Is Everything

A spreadsheet with 10,000 rows cannot render 10,000 DOM elements. The browser will die. Virtual scroll means you only render the rows currently visible on screen — and replace them as the user scrolls. Getting this right took three complete rewrites.

## Formula Parsing Is a Compiler Problem

SUM, IF, VLOOKUP — these aren't simple string operations. They're a mini programming language. I ended up writing a recursive descent parser for formulas. It's about 400 lines of code and handles nested functions, cell ranges, and relative/absolute references.

## Multi-Sheet State

Each sheet needs its own data, formula dependencies, and selection state. But sheets also need to reference each other (Sheet2!A1). Managing this cleanly required building a proper dependency graph.

## The Honest Part

Building this solo was genuinely hard. There were weeks where I wasn't sure it was possible. But every hard technical problem has a solution — it just takes longer than you expect.`,

    excerpt:"A deep dive into Orbit's voice output system: why we chose streaming over batch TTS, how we handle WebSocket audio delivery, and what's next.",
    content:`Voice changes everything.

Reading an AI response is one experience. Hearing it — immediately, naturally, without waiting — is a fundamentally different one. That's why we built streaming voice into Orbit AI.

## Why Streaming?

The naive approach to TTS: generate the full response, convert to audio, then play it. The problem: for a 500-word response, you're waiting 3–5 seconds before hearing anything. Streaming TTS works differently. The audio starts playing while the response is still being generated. The first sentence plays within milliseconds.

## The Technical Stack

We use OpenAI's TTS API with streaming enabled. On the backend (FastAPI), we open a WebSocket connection to the client and stream audio chunks as they arrive from OpenAI. On the frontend, we use the Web Audio API to decode and play the chunks in real time.

## The Hard Part

Gapless playback is genuinely difficult. If there's any gap between audio chunks, you hear a click. We solved this by pre-buffering one chunk ahead at all times.

## What's Next

We're exploring real-time voice input — so you can speak to Orbit and have it respond vocally. Full voice interface. Coming soon.`,

A significant portion of Indian business communication happens on WhatsApp. Customer orders, supplier invoices, team coordination — all on a platform that global enterprise software largely ignores. Alaada is building for this reality.

    content:`Publishing a Python package to PyPI for the first time is both easier and harder than you expect. Easier: the tooling is good. Harder: the decisions before you write a single line of code.

Choose your package name before you write any code. Check PyPI availability early. And write your CHANGELOG from day one.

/**
 * Generic fetch wrapper.
 * Automatically attaches Authorization header when sessionToken is set.
 * Returns parsed JSON on success, throws on HTTP errors.
 */
async function apiFetch(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (sessionToken) headers['Authorization'] = `Bearer ${sessionToken}`;

  const res = await fetch(`${API_BASE}${path}`, { ...options, headers });

  // For DELETE /auth, 200 with JSON body
  if (!res.ok) {
    let detail = `HTTP ${res.status}`;
    try { const j = await res.json(); detail = j.detail || detail; } catch(_) {}
    throw new Error(detail);
  }
  // Some endpoints return empty body
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

/**
 * Fetch posts for PUBLIC visitors from raw.githubusercontent.com.
 * Falls back to DEFAULT_POSTS if the URL is not configured or the fetch fails.
 */
async function fetchPublicPosts() {
  if (!PUBLIC_POSTS || PUBLIC_POSTS.includes('your-org')) {
    // URL not configured — use built-in defaults
    return JSON.parse(JSON.stringify(DEFAULT_POSTS));
  }
  try {
    const res = await fetch(PUBLIC_POSTS);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch(e) {
    console.warn('Could not load public posts, falling back to defaults:', e.message);
    return JSON.parse(JSON.stringify(DEFAULT_POSTS));
  }
}

/**
 * Fetch posts for ADMIN — uses the authenticated GET /posts endpoint.
 */
async function fetchAdminPosts() {
  return await apiFetch('/posts');
}

/**
 * Ping the backend root to verify connectivity.
 */
async function pingBackend() {
  try {
    await fetch(`${API_BASE}/`, { method:'GET' });
    apiStatus = 'ok';
  } catch(_) {
    apiStatus = 'err';
  }
}

/* ════════════════════════════════════════════════════════════════
   DATA INIT
════════════════════════════════════════════════════════════════ */
async function loadData() {
  loadReads();
  pingBackend(); // fire-and-forget — used for status badge only
  posts = await fetchPublicPosts();
}

/* ════════════════════════════════════════════════════════════════
   AUTH  —  /auth POST & DELETE
════════════════════════════════════════════════════════════════ */

/**
 * POST /auth  — exchange password for a Bearer token.
 * Returns { token } on success, throws on failure.
 */
async function apiLogin(password) {
  const data = await apiFetch('/auth', {
    method: 'POST',
    body: JSON.stringify({ password })
  });
  return data; // { token: "..." }
}

/**
 * DELETE /auth  — invalidate the current session on the server.
 */
async function apiLogout() {
  if (!sessionToken) return;
  try { await apiFetch('/auth', { method: 'DELETE' }); } catch(_) {}
  sessionToken = null;
}

/* ════════════════════════════════════════════════════════════════
   SAVE POSTS  —  PUT /posts
════════════════════════════════════════════════════════════════ */
async function savePosts() {
  if (!sessionToken) throw new Error('Not authenticated.');
  const result = await apiFetch('/posts', {
    method: 'PUT',
    body: JSON.stringify({ posts })
  });
  // result = { success, committed, commit_sha, commit_url, message }
  return result;
}

/* ════════════════════════════════════════════════════════════════
   UTILS
════════════════════════════════════════════════════════════════ */
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderContent(text) {
  return (text || '').split(/\n\n+/).map(para => {
    const t = para.trim();
    if (!t) return '';
    if (t.startsWith('## ')) return `<h2>${esc(t.slice(3))}</h2>`;
    if (t.startsWith('# '))  return `<h2>${esc(t.slice(2))}</h2>`;
    return `<p>${esc(t).replace(/\n/g,'<br>')}</p>`;
  }).join('');
}

function cat(c) { return CAT[c] || CAT.story; }

function topPosts(n = 4) {
  return [...posts].sort((a,b) => (reads[b.id]||0) - (reads[a.id]||0)).slice(0, n);
}

function featured() { return posts.find(p => p.featured) || null; }

function getFiltered() {
  if (filter === 'all') {
    const f    = featured();
    const rest = posts.filter(p => !p.featured).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    return { featuredPost: f, rest };
  }
  const all = posts.filter(p => p.category === filter).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  return { featuredPost: null, rest: all };
}

function genId() { return 'post-' + Date.now() + '-' + Math.random().toString(36).slice(2,6); }

function toast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function nowMonthYear() {
  return new Date().toLocaleString('en-US', { month:'long', year:'numeric' });
}

function scrollTop() { window.scrollTo({ top:0, behavior:'instant' }); }

function openPost(id) {

      </div>
      <div class="form-field">
        <label class="form-label">Read time (mins)</label>
        <input class="form-input" type="number" id="f-readtime" min="1" value="${esc(fp.readTime)}"/>
      </div>
    </div>
    <div class="form-checkbox-row">
      <input type="checkbox" class="form-checkbox" id="f-featured" ${fp.featured ? 'checked' : ''}/>
      <label class="form-checkbox-label" for="f-featured">Set as Featured Post</label>
    </div>
    ${formErr ? `<div class="error-msg" style="margin-bottom:10px;">⚠ ${esc(formErr)}</div>` : ''}
    ${commitHTML}
    <button class="save-btn" onclick="savePost()">${editId === 'new' ? 'Publish Post ✓' : 'Save Changes ✓'}</button>
    <button class="cancel-btn" onclick="cancelEdit()">Cancel</button>
    ${savingOverlay}
  ` : `<div class="form-idle">
    <div class="form-idle-icon">✍️</div>
    <div class="form-idle-title">Ready to write?</div>
    <div class="form-idle-text">Click <strong>+ New Post</strong> to write something new, or hit <strong>Edit</strong> on any existing post to update it.</div>
    ${commitHTML}
  </div>`;

  return `
    <div class="admin-panel">
      <div class="admin-header">
        <div>
          <div class="admin-title">Blog Admin</div>
          <div class="admin-stats" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;">
            <span>${posts.length} post${posts.length !== 1 ? 's' : ''} · ${totalViews} total view${totalViews !== 1 ? 's' : ''}</span>
            <span class="api-badge ${badgeClass}">
              <span class="api-badge-dot"></span>${esc(badgeLabel)}
            </span>
          </div>
        </div>
        <button class="admin-logout" onclick="logout()">Sign out</button>
      </div>
      <div class="admin-grid">
        <div>
          <div class="admin-section-header">
            <div class="admin-section-label">All Posts</div>
            <button class="btn-new" onclick="startNew()">+ New Post</button>
          </div>
          <div class="admin-posts-list">${postsHTML}</div>
        </div>
        <div class="admin-form-card" style="position:relative;">${formHTML}</div>
      </div>
    </div>
  `;
}

/* ════════════════════════════════════════════════════════════════
   MAIN RENDER
════════════════════════════════════════════════════════════════ */
function render() {
  const app = document.getElementById('app');
  let content = '';
  switch(view) {
    case 'list':        content = renderList();        break;
    case 'post':        content = renderPost();        break;
    case 'admin-login': content = renderAdminLogin();  break;
    case 'admin':       content = renderAdminPanel();  break;
    default:            content = renderList();
  }
  app.innerHTML = renderNav() + content;
}

/* ════════════════════════════════════════════════════════════════
   ACTIONS
════════════════════════════════════════════════════════════════ */
function setFilter(f) { filter = f; render(); }

/* ── Login: calls POST /auth ── */
async function tryLogin() {
  const pwEl = document.getElementById('admin-pw');
  const btn  = document.getElementById('login-btn');
  if (!pwEl) return;

  const pw = pwEl.value;
  if (!pw) { adminErr = 'Please enter your password.'; render(); return; }

  // Disable button while waiting
  if (btn) { btn.disabled = true; btn.textContent = 'Signing in…'; }

  try {
    const data     = await apiLogin(pw);
    sessionToken   = data.token;
    adminErr       = '';
    editId         = null;
    lastCommit     = null;

    // Reload posts from the authenticated /posts endpoint (bypasses GitHub CDN cache)
    posts = await fetchAdminPosts();

    view = 'admin';
    render();
    scrollTop();
  } catch(e) {
    adminErr = e.message === 'Incorrect password.' ? 'Incorrect password.' : `Sign-in failed: ${e.message}`;
    render();
    setTimeout(() => document.getElementById('admin-pw')?.focus(), 50);
  }
}

/* ── Logout: calls DELETE /auth ── */
async function logout() {
  await apiLogout();
  lastCommit = null;
  // Reload public posts (visitor version)
  posts = await fetchPublicPosts();
  nav('list');
}

function startNew() {
  editId = 'new'; formErr = ''; lastCommit = null;
  render();
  setTimeout(() => document.getElementById('f-title')?.focus(), 80);
}

function startEdit(id) {
  editId = id; formErr = ''; lastCommit = null;
  render();
  setTimeout(() => document.getElementById('f-title')?.focus(), 80);
}

function cancelEdit() { editId = null; formErr = ''; render(); }

/* ── Save: mutates posts[] then calls PUT /posts ── */
async function savePost() {
  if (isSaving) return;

  const g        = id => document.getElementById(id);
  const title    = g('f-title')?.value?.trim()    || '';
  const excerpt  = g('f-excerpt')?.value?.trim()  || '';
  const content  = g('f-content')?.value?.trim()  || '';
  const category = g('f-category')?.value         || 'product';
  const emoji    = g('f-emoji')?.value             || '🚀';
  const date     = g('f-date')?.value?.trim()      || nowMonthYear();
  const readTime = g('f-readtime')?.value?.trim()  || '5';
  const isFeat   = g('f-featured')?.checked        || false;

  if (!title)   { formErr = 'Title is required.';   render(); return; }
  if (!content) { formErr = 'Content is required.'; render(); return; }
  formErr = '';

  // Unfeature all others if this one is featured
  if (isFeat) posts.forEach(p => p.featured = false);

  if (editId === 'new') {
    posts.unshift({
      id: genId(), title, excerpt, content, category, emoji,
      date, readTime, featured: isFeat,
      createdAt: new Date().toISOString().slice(0, 10)
    });
  } else {
    const idx = posts.findIndex(p => p.id === editId);
    if (idx !== -1) {
      posts[idx] = { ...posts[idx], title, excerpt, content, category, emoji, date, readTime, featured: isFeat };
    }
  }

  // Show saving overlay
  isSaving = true;
  render();

  try {
    const result = await savePosts(); // PUT /posts → GitHub commit
    lastCommit   = { sha: result.commit_sha, url: result.commit_url };
    isSaving     = false;
    editId       = null;
    toast(editId === null ? 'Post published & committed to GitHub ✓' : 'Saved & committed to GitHub ✓');
    render();
  } catch(e) {
    isSaving   = false;
    formErr    = `GitHub commit failed: ${e.message}`;
    render();
  }
}

/* ── Delete: removes from posts[] then calls PUT /posts ── */
async function deletePost(id) {
  const p = posts.find(pp => pp.id === id);
  if (!p) return;
  if (!confirm(`Delete "${p.title}"?\n\nThis will commit the deletion to GitHub.`)) return;

  posts = posts.filter(pp => pp.id !== id);
  if (editId === id) editId = null;

  isSaving = true;
  render();

  try {
    const result = await savePosts();
    lastCommit   = { sha: result.commit_sha, url: result.commit_url };
    isSaving     = false;
    toast('Post deleted & committed to GitHub.');
    render();
  } catch(e) {
    isSaving = false;
    toast(`Delete failed: ${e.message}`);
    // Re-add the post on failure so state stays consistent
    posts.push(p);
    render();
  }
}

/* ── Toggle Featured: updates posts[] then calls PUT /posts ── */
async function toggleFeatured(id) {
  const isNowFeatured = !posts.find(p => p.id === id)?.featured;
  posts.forEach(p => p.featured = p.id === id ? isNowFeatured : false);

  isSaving = true;
  render();

  try {
    const result = await savePosts();
    lastCommit   = { sha: result.commit_sha, url: result.commit_url };
    isSaving     = false;
    toast(isNowFeatured ? '★ Set as featured & committed.' : 'Removed from featured & committed.');
    render();
  } catch(e) {
    isSaving = false;
    toast(`Failed to commit: ${e.message}`);
    // Revert the toggle on failure
    posts.forEach(p => { if (p.id === id) p.featured = !isNowFeatured; });
    render();
  }
}

/* ── Newsletter handlers (unchanged) ── */
function handleNL() {
  const el = document.getElementById('sb-email');
  if (!el || !el.value.includes('@')) return;
  const wrap = document.getElementById('sb-nl-wrap');
  if (wrap) wrap.innerHTML = '<div style="text-align:center;padding:12px 0;"><div style="font-size:1.4rem;margin-bottom:6px;">✓</div><div style="font-family:\'Syne\',sans-serif;font-weight:700;font-size:.88rem;color:var(--ink);">You\'re subscribed!</div><div style="font-size:.76rem;color:var(--ink3);margin-top:4px;">New posts will land in your inbox.</div></div>';
}

function handleMainNL() {
  const el = document.getElementById('main-email');
  if (!el || !el.value.includes('@')) return;
  const wrap = document.getElementById('main-nl-wrap');
  if (wrap) wrap.innerHTML = '<div style="padding:14px 0;"><span style="color:#4ade80;font-weight:700;font-size:.9rem;">✓ Subscribed! New posts will land in your inbox.</span></div>';
}

/* ════════════════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════════════════ */
async function init() {
  await loadData();
  render();
}

init();
</script>
