<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alaada Universe — Coming Soon</title>
  <link rel="icon" href="images/alaada-icon.png" type="image/png">

  <style>
    /* ---------- Base / original styles (kept) ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
      background: black;
      overflow-y: auto;
    }

    /* ---------- Background video (kept path unchanged) ---------- */
    video.bg {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;               /* base layer */
      pointer-events: none;     /* don't intercept interactions */
      filter: brightness(0.4);
      display: block;
      will-change: transform;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    /* Ensure main UI layers sit above video */
    header, .content, .links, .community-videos, footer {
      position: relative;
      z-index: 2;
    }

    /* Main content (original) */
    .content {
      margin-top: 120px;
      z-index: 2;
      position: relative;
      padding: 0 18px;
    }

    h1 {
      font-size: 3rem;
      background: linear-gradient(90deg, #00b4d8, #8a2be2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #00b4d8; }
      to { text-shadow: 0 0 25px #8a2be2; }
    }
    p { font-size: 1.2rem; opacity: 0.8; margin-top: 10px; }

    .links { margin-top: 40px; }
    .links a {
      color: #00b4d8;
      text-decoration: none;
      border: 1px solid #00b4d8;
      padding: 10px 20px;
      border-radius: 25px;
      margin: 10px;
      transition: 0.25s ease;
      display: inline-block;
    }
    .links a:hover { background: #00b4d8; color: black; transform: translateY(-3px); }

    /* ---------- Community Videos (new) ---------- */
    .community-videos {
      margin-top: 80px;
      padding: 20px;
      position: relative;
      z-index: 2;
      text-align: left;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    .community-videos h2 {
      font-size: 1.9rem;
      margin-bottom: 16px;
      background: linear-gradient(90deg, #8a2be2, #00b4d8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Grid: 3 / 2 / 1 columns */
    .community-videos .videos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    @media (max-width: 1000px) {
      .community-videos .videos-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .community-videos .videos-grid { grid-template-columns: 1fr; }
    }

    /* Card */
    .community-videos .video-card {
      background: rgba(8,10,16,0.5);
      padding: 12px;
      border-radius: 12px;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(2,6,23,0.55);
      border: 1px solid rgba(255,255,255,0.04);
      transition: transform 180ms cubic-bezier(.2,.9,.3,1), box-shadow 180ms ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 1px;
    }
    .community-videos .video-card:focus { outline: 3px solid rgba(124,58,237,0.18); outline-offset: 4px; }
    .community-videos .video-card:hover { transform: translateY(-6px) scale(1.01); box-shadow: 0 18px 60px rgba(2,6,23,0.66); }

    .community-videos .video-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      border-radius: 10px;
      position: relative;
      background: rgba(0,0,0,0.12);
    }
    .community-videos .video-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: contrast(0.98) saturate(1.05);
      transform-origin: center center;
      transition: transform 300ms ease;
      pointer-events: none; /* thumbnail shouldn't capture clicks, card handles clicks */
    }
    .community-videos .video-card:hover .video-thumb video { transform: scale(1.03); }

    /* Play badge */
    .community-videos .play-badge {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      width: 60px;
      height: 60px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(90deg, rgba(6,182,212,0.95), rgba(124,58,237,0.95));
      box-shadow: 0 10px 30px rgba(6,182,212,0.12);
      opacity: 0.98;
      transition: transform 140ms ease;
      pointer-events: none;
    }
    .community-videos .video-card:hover .play-badge { transform: translate(-50%,-50%) scale(1.06); }
    .community-videos .play-badge svg { width: 20px; height: 20px; fill: #fff; }

    .community-videos .video-meta {
      margin-top: 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .community-videos .video-title {
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.2;
    }
    .community-videos .video-sub {
      color: rgba(255,255,255,0.72);
      font-size: 0.9rem;
    }

    /* Fullscreen overlay player (in-page) */
    #videoOverlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(2,6,23,0.88), rgba(2,6,23,0.96));
      z-index: 9999;
      padding: 18px;
    }
    #videoOverlay.active { display: flex; }
    #videoOverlay .overlay-inner {
      width: 100%;
      max-width: 1200px;
      height: calc(100% - 72px);
      display:flex;
      align-items:center;
      justify-content:center;
      position: relative;
    }
    #overlayPlayer {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 24px 80px rgba(0,0,0,0.7);
    }
    .overlay-close {
      position: absolute;
      top: -10px;
      right: -10px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 8px;
      cursor: pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition: transform .12s ease;
    }
    .overlay-close:hover { transform: scale(1.06); background: rgba(255,255,255,0.09); }
    .overlay-title {
      position: absolute;
      bottom: -48px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255,255,255,0.94);
      font-weight: 700;
      font-size: 1rem;
    }

    /* Small accessibility helpers */
    .sr-only {
      position: absolute !important;
      height: 1px; width: 1px;
      overflow: hidden; clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <!-- Background Video (unchanged path) -->
  <video class="bg" autoplay muted loop playsinline preload="auto">
    <source src="images/space.mp4" type="video/mp4">
  </video>

  <!-- Main Text (original content preserved) -->
  <div class="content">
    <h1>🌌 Alaada Universe</h1>
    <p>This space is being built — soon you’ll explore the full Alaada ecosystem.</p>
    <div class="links">
      <a href="index.html">⬅ Return to Home page</a>
      <a href="alaada-os.html">⚙ Go to Alaada OS</a>
    </div>
  </div>

  <!-- ======= Community Videos (new) ======= -->
  <section class="community-videos" aria-labelledby="communityVideosHeading">
    <h2 id="communityVideosHeading">Community Videos</h2>

    <div class="videos-grid" id="videosGrid" aria-live="polite">
      <!-- Single card showing the friend's video (images/Arko.mp4) -->
      <article class="video-card" data-src="images/Arko.mp4" tabindex="0" role="button" aria-label="Play video Arko – Official Release">
        <div class="video-thumb" aria-hidden="true">
          <!-- HTML <video> provides the thumbnail (first frame) -->
          <video muted preload="metadata" src="images/Arko.mp4" playsinline></video>
          <div class="play-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
              <path d="M8 5v14l11-7z"></path>
            </svg>
          </div>
        </div>

        <div class="video-meta">
          <div>
            <div class="video-title">Arko – Official Release</div>
            <div class="video-sub">Uploaded by: Aarka, Aaditya and Adrijo</div>
          </div>
        </div>
      </article>

      <!-- If you want more items later, duplicate <article> and set data-src to the file path -->
    </div>
  </section>

  <!-- Fullscreen overlay player (plays inside the page) -->
  <div id="videoOverlay" aria-hidden="true" role="dialog" aria-label="Video player overlay">
    <div class="overlay-inner" role="document">
      <button class="overlay-close" id="overlayClose" aria-label="Close video player">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M18 6L6 18M6 6l12 12" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <video id="overlayPlayer" controls playsinline preload="auto"></video>
      <div class="overlay-title" id="overlayTitle">Arko – Official Release</div>
    </div>
  </div>

  <script>
    (function () {
      // Elements
      const grid = document.getElementById('videosGrid');
      const overlay = document.getElementById('videoOverlay');
      const overlayPlayer = document.getElementById('overlayPlayer');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayClose = document.getElementById('overlayClose');

      // Helper: open player for a card
      function openPlayerForCard(card) {
        const src = card.dataset.src;
        if (!src) return;
        overlayPlayer.src = src;
        overlayPlayer.currentTime = 0;
        overlayPlayer.muted = false; // user initiated so allow sound
        overlayTitle.textContent = card.querySelector('.video-title')?.textContent || 'Video';
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');

        // Try to play (user gesture already triggered this)
        const p = overlayPlayer.play();
        if (p && typeof p.then === 'function') {
          p.catch(() => {
            // If autoplay with sound blocked, leave paused; user can press play
            overlayPlayer.pause();
          });
        }

        // focus close button for accessibility
        overlayClose.focus();
      }

      // Click delegation on grid
      grid.addEventListener('click', function (e) {
        const card = e.target.closest('.video-card');
        if (!card) return;
        openPlayerForCard(card);
      });

      // Keyboard activation (Enter / Space)
      grid.addEventListener('keydown', function (e) {
        const card = e.target.closest('.video-card');
        if (!card) return;
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          openPlayerForCard(card);
        }
      });

      // Close overlay
      function closeOverlay() {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        try { overlayPlayer.pause(); } catch (err) {}
        overlayPlayer.removeAttribute('src');
        overlayPlayer.load();
      }

      overlayClose.addEventListener('click', function (e) {
        e.stopPropagation();
        closeOverlay();
      });

      // Clicking outside the player closes it
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeOverlay();
      });

      // ESC to close
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && overlay.classList.contains('active')) {
          closeOverlay();
        }
      });

      // Return focus to first card after overlay closes
      overlay.addEventListener('transitionend', function () {
        if (!overlay.classList.contains('active')) {
          const firstCard = document.querySelector('.video-card');
          if (firstCard) firstCard.focus();
        }
      });

      // Thumbnail videos: hide controls and prevent pointer interactions
      document.querySelectorAll('.community-videos .video-thumb video').forEach(v => {
        v.controls = false;
        v.addEventListener('loadedmetadata', () => {
          // nothing — browser uses first frame as visible thumbnail
        });
      });

      // Background autoplay fallback (attempt immediate play; if blocked, play on first gesture)
      const bg = document.querySelector('video.bg');
      if (bg) {
        bg.play().catch(() => { /* ignore */ });

        function tryPlayBg() {
          if (!bg) return;
          if (bg.paused) {
            bg.play().catch(() => {
              try { bg.muted = true; } catch (err) {}
            });
          }
          ['click', 'keydown', 'touchstart'].forEach(ev => document.removeEventListener(ev, tryPlayBg));
        }
        ['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, tryPlayBg, { passive: true }));
      }
    })();
  </script>
</body>
</html>
