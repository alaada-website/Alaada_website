  <title>Alaada Universe — Coming Soon</title>
  <link rel="icon" href="images/alaada-icon.png" type="image/png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
    }
    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: brightness(0.4);
    }
    .content {
      position: relative;
      top: 40%;
      transform: translateY(-50%);
      z-index: 2;
    }
    h1 {
      font-size: 3rem;
      background: linear-gradient(90deg, #00b4d8, #8a2be2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #00b4d8; }
      to { text-shadow: 0 0 25px #8a2be2; }
    }
    p {
      font-size: 1.2rem;
      opacity: 0.8;
      margin-top: 10px;
    }
    .links {
      margin-top: 40px;
    }
    .links a {
      color: #00b4d8;
      text-decoration: none;
      border: 1px solid #00b4d8;
      padding: 10px 20px;
      border-radius: 25px;
      margin: 10px;
      transition: 0.3s;
    }
    .links a:hover {
      background: #00b4d8;
      color: black;
    }
  </style>
</head>
