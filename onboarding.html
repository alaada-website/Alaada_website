<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get started · Alaada</title><style>body{margin:0;background:#f5f4ef;color:#242321;font:15px system-ui,sans-serif}.shell{max-width:600px;margin:8vh auto;padding:20px}.card{background:#fffdf8;border:1px solid #dedbd2;border-radius:18px;padding:28px}h1{margin:0 0 6px}.muted{color:#77746d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:12px 0}.field label{display:block;color:#77746d;font-size:.8rem;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #dedbd2;border-radius:9px;box-sizing:border-box;font:inherit}button{border:0;border-radius:9px;padding:11px 15px;background:#242321;color:white;font:inherit;cursor:pointer}.status{min-height:22px;color:#77746d}.error{color:#b33c35}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="shell"><main class="card"><h1>Welcome to Alaada</h1><p class="muted">Set up your profile and workspace. You can change these details later.</p><form id="form"><div class="grid"><div class="field"><label for="first">First name</label><input id="first" required></div><div class="field"><label for="last">Last name</label><input id="last"></div></div><div class="field"><label for="kind">How will you use Alaada?</label><select id="kind"><option value="individual">Personally</option><option value="business">For a business or team</option></select></div><div id="org-fields"><div class="grid"><div class="field"><label for="org">Organization name</label><input id="org" placeholder="Optional"></div><div class="field"><label for="slug">Organization slug</label><input id="slug" pattern="[a-z0-9-]{3,48}" placeholder="optional-slug"></div></div></div><button>Continue to Alaada</button><p id="status" class="status" role="status"></p></form></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.ALAADA_CONFIG=window.ALAADA_CONFIG||{};</script><script src="js/alaada-ums.js"></script><script>const $=id=>document.getElementById(id),msg=(x,e=false)=>{$('status').textContent=x;$('status').className=e?'status error':'status'};async function boot(){if(!window.AlaadaUMS){msg('Alaada authentication is not configured.',true);return}await AlaadaUMS.refresh();if(!AlaadaUMS.user){location.replace('/auth.html?next=/onboarding.html');return}if(AlaadaUMS.profile?.onboarding_completed){location.replace('/account.html');return}}$('kind').onchange=()=>{$('org-fields').style.display=$('kind').value==='business'?'block':'none'};$('form').onsubmit=async e=>{e.preventDefault();try{const r=await AlaadaUMS.updateProfile({first_name:$('first').value.trim(),last_name:$('last').value.trim(),display_name:`${$('first').value.trim()} ${$('last').value.trim()}`.trim(),onboarding_completed:true});if(r.error)throw r.error;if($('kind').value==='business'&&$('org').value.trim()){const slug=$('slug').value.trim()||$('org').value.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48);const created=await AlaadaUMS.createOrganization($('org').value,slug);if(created.error)throw created.error}location.replace('/account.html')}catch(err){msg(err.message||'Could not complete onboarding.',true)}};boot();</script></body></html>
