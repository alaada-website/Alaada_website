    :root {
      --bg: #090d14;
      --card: #0f1721;
      --primary: #4f46e5;
      --text: #fff;
      --muted: #9aa0b0;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: var(--card);
    }
    nav .logo h1 {
      font-size: 1.2rem;
      color: var(--primary);
      margin: 0;
    }
    nav .menu a {
      margin-left: 1.5rem;
      color: var(--text);
      text-decoration: none;
    }
    .content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }
    .content h2 {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 1rem;
    }
    .content p {
      font-size: 1.1rem;
      color: var(--muted);
    }
    footer {
      text-align: center;
      padding: 2rem;
      background: var(--card);
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
